<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Box</title>
    <style>
      :root {
        --bg: #f5efe7;
        --bg-2: #fdfaf5;
        --panel: rgba(255, 255, 255, 0.82);
        --card: #ffffff;
        --ink: #1f1a17;
        --muted: #685d55;
        --line: #eadfd1;
        --accent: #d96b45;
        --accent-dark: #b9502e;
        --olive: #688d5d;
        --gold: #e0b55d;
        --soft: #f7f1e8;
        --shadow: 0 18px 38px rgba(43, 28, 20, 0.08);
        --shadow-soft: 0 10px 24px rgba(43, 28, 20, 0.06);
        --search-bg: rgba(255,255,255,0.75);
        --modal-bg: rgba(16, 12, 10, 0.62);
        --chip: #fff6ef;
        --success: #3d8f62;
      }

      body[data-theme="dark"] {
        --bg: #121713;
        --bg-2: #1b201d;
        --panel: rgba(28, 35, 32, 0.9);
        --card: #1c2420;
        --ink: #f4f1ee;
        --muted: #b9b0aa;
        --line: #34413d;
        --accent: #f29b6c;
        --accent-dark: #d97d4a;
        --olive: #8bb179;
        --gold: #f1c567;
        --soft: #1d2925;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
        --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.2);
        --search-bg: rgba(25, 31, 29, 0.9);
        --modal-bg: rgba(3, 5, 4, 0.7);
        --chip: rgba(242, 155, 108, 0.12);
        --success: #7bc89d;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--ink);
        transition: background 0.25s ease, color 0.25s ease;
      }

      button, input, select {
        font: inherit;
      }

      .page {
        max-width: 1220px;
        margin: 0 auto;
        padding: 32px 20px 72px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 22px;
      }

      .brand {
        display: grid;
        gap: 6px;
      }

      .eyebrow {
        margin: 0;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 4vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: min(340px, 100%);
        background: var(--search-bg);
        border: 1px solid var(--line);
        padding: 12px 14px;
        border-radius: 999px;
        box-shadow: var(--shadow-soft);
      }

      .search-wrap span {
        font-size: 1.1rem;
      }

      .search-wrap input {
        border: none;
        background: transparent;
        outline: none;
        color: var(--ink);
        width: 100%;
        font-size: 0.96rem;
      }

      .search-wrap input::placeholder {
        color: var(--muted);
      }

      .icon-btn, .cta, .secondary-btn, .favorite-btn, .modal-close, .view-btn, .sort-select, .shop-toggle {
        cursor: pointer;
      }

      .icon-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow-soft);
      }

      .cta {
        border: none;
        background: var(--ink);
        color: white;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      body[data-theme="dark"] .cta {
        background: #f4f1ee;
        color: #101713;
      }

      #favoritesCount {
        display: inline-block;
        min-width: 1.4em;
      }

      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .filter {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.1);
        color: var(--ink);
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .filter.is-active,
      .filter:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      .sort-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
      }

      .sort-wrap label {
        color: var(--muted);
        font-weight: 700;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .sort-select {
        background: transparent;
        border: none;
        color: var(--ink);
        outline: none;
        font-weight: 700;
      }

      .featured {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 20px;
        margin-bottom: 28px;
      }

      .feature-pane,
      .stats-card,
      .recent-panel,
      .shopping-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      .feature-pane {
        position: relative;
        overflow: hidden;
        padding: 26px 24px;
        background: linear-gradient(135deg, rgba(254, 202, 141, 0.32) 0%, rgba(255, 255, 255, 0.82) 100%);
      }

      body[data-theme="dark"] .feature-pane {
        background: linear-gradient(135deg, rgba(232, 142, 77, 0.18) 0%, rgba(28,35,32,0.95) 100%);
      }

      .feature-pane::before {
        content: "✨";
        position: absolute;
        right: 18px;
        top: 18px;
        font-size: 2.3rem;
        opacity: 0.8;
      }

      .feature-pane h2 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: clamp(2rem, 3vw, 2.8rem);
        letter-spacing: -0.06em;
      }

      .feature-pane p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
        max-width: 62ch;
      }

      .feature-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .feature-meta span {
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--line);
        padding: 8px 10px;
        font-weight: 700;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .feature-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .secondary-btn,
      .view-btn,
      .shop-toggle {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--ink);
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 700;
      }

      .stats-card {
        padding: 20px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px,1fr));
        gap: 14px;
        height: 100%;
      }

      .stat {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 18px 16px;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        letter-spacing: -0.05em;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .utility-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 28px;
      }

      .recent-panel,
      .shopping-panel {
        padding: 18px 20px;
      }

      .recent-panel h3,
      .shopping-panel h3 {
        margin: 0 0 12px;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .recent-list,
      .shopping-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .recent-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
      }

      .recent-list button {
        background: transparent;
        border: none;
        color: var(--ink);
        font-weight: 700;
        padding: 0;
        cursor: pointer;
      }

      .shopping-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
      }

      .shopping-list .label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .shopping-list input {
        accent-color: var(--accent);
      }

      .shopping-list .remove {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 1.2rem;
        cursor: pointer;
      }

      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 22px;
      }

      .recipe-card {
        display: none;
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(12px) scale(0.985);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .recipe-card.is-visible {
        display: block;
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .card-actions {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 2;
      }

      .favorite-btn {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 50%;
        background: rgba(18, 18, 18, 0.12);
        color: white;
        font-size: 1.4rem;
        backdrop-filter: blur(3px);
      }

      .favorite-btn.is-favorited {
        background: rgba(255,255,255,0.96);
        color: #db4d4d;
        border-color: rgba(255,255,255,0.96);
      }

      .recipe-visual {
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4.4rem;
        color: rgba(255,255,255,0.9);
        text-shadow: 0 6px 18px rgba(0,0,0,0.14);
      }

      .recipe-card[data-color="gold"] .recipe-visual { background: linear-gradient(135deg, #ffd76a, #e5a93a); }
      .recipe-card[data-color="green"] .recipe-visual { background: linear-gradient(135deg, #7dba63, #3e7f4c); }
      .recipe-card[data-color="orange"] .recipe-visual { background: linear-gradient(135deg, #eaa06d, #ca6330); }
      .recipe-card[data-color="blue"] .recipe-visual { background: linear-gradient(135deg, #6f9dd6, #3d6db1); }
      .recipe-card[data-color="rose"] .recipe-visual { background: linear-gradient(135deg, #cb876d, #8f5642); }
      .recipe-card[data-color="teal"] .recipe-visual { background: linear-gradient(135deg, #5ab9a5, #2d7f72); }
      .recipe-card[data-color="purple"] .recipe-visual { background: linear-gradient(135deg, #ab8fe2, #6d5ab5); }
      .recipe-card[data-color="coral"] .recipe-visual { background: linear-gradient(135deg, #f39d7a, #d96b45); }
      .recipe-card[data-color="mint"] .recipe-visual { background: linear-gradient(135deg, #9ad6bb, #5b987d); }
      .recipe-card[data-color="sunset"] .recipe-visual { background: linear-gradient(135deg, #ffb26d, #ed7d53); }
      .recipe-card[data-color="lavender"] .recipe-visual { background: linear-gradient(135deg, #c7a9f7, #8069c9); }
      .recipe-card[data-color="berry"] .recipe-visual { background: linear-gradient(135deg, #ff93a8, #b14d7f); }

      .recipe-info {
        padding: 20px;
      }

      .recipe-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .tag {
        background: #fff1e8;
        color: var(--accent-dark);
        border-radius: 999px;
        padding: 6px 9px;
      }

      body[data-theme="dark"] .tag {
        background: rgba(242, 155, 108, 0.15);
        color: #f7bf9d;
      }

      h3 {
        margin: 14px 0 10px;
        font-size: 1.6rem;
        letter-spacing: -0.04em;
      }

      .recipe-info p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.6;
      }

      .card-buttons {
        margin-top: 12px;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal[hidden] { display: none; }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: var(--modal-bg);
      }

      .modal-dialog {
        position: relative;
        width: min(760px, 100%);
        max-height: 86vh;
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 30px;
        box-shadow: var(--shadow);
        padding: 26px;
      }

      .modal-close {
        position: absolute;
        right: 16px;
        top: 16px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--ink);
        font-size: 1.4rem;
      }

      .modal-header {
        margin-bottom: 18px;
        padding-right: 42px;
      }

      .modal-header h2 {
        margin: 10px 0 8px;
        font-size: clamp(2rem, 3vw, 2.5rem);
        letter-spacing: -0.05em;
      }

      .modal-body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .modal-body h3 {
        margin: 0 0 10px;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .ingredient-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .ingredient-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
      }

      .ingredient-list input {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
      }

      .modal-body ol {
        margin: 0;
        padding-left: 18px;
        line-height: 1.8;
      }

      .modal-body li + li { margin-top: 4px; }

      .modal-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .modal-meta span {
        background: var(--soft);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .shop-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      @media (max-width: 900px) {
        .featured,
        .utility-area { grid-template-columns: 1fr; }
        .recipe-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      }

      @media (max-width: 620px) {
        .page { padding: 20px 14px 48px; }
        .topbar {
          flex-direction: column;
          align-items: stretch;
        }
        .toolbar {
          width: 100%;
        }
        .search-wrap {
          min-width: 0;
          flex: 1 1 auto;
        }
        .recipe-grid { grid-template-columns: 1fr; }
        .modal-body { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Kitchen Collection</p>
          <h1>Recipe Box</h1>
        </div>

        <div class="toolbar">
          <label class="search-wrap" aria-label="Search recipes">
            <span>🔎</span>
            <input id="searchInput" type="search" placeholder="Search recipes..." />
          </label>
          <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">🌙</button>
          <button class="cta" type="button">Saved <span id="favoritesCount">0</span></button>
        </div>
      </header>

      <div class="controls-row">
        <nav class="filters" aria-label="Recipe categories">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="breakfast">Breakfast</button>
          <button class="filter" type="button" data-filter="lunch">Lunch</button>
          <button class="filter" type="button" data-filter="dinner">Dinner</button>
          <button class="filter" type="button" data-filter="vegetarian">Vegetarian</button>
          <button class="filter" type="button" data-filter="dessert">Dessert</button>
          <button class="filter" type="button" data-filter="favorites">Favorites</button>
        </nav>

        <div class="sort-wrap">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect" class="sort-select" aria-label="Sort recipes">
            <option value="featured">Featured</option>
            <option value="time-asc">Prep time ↑</option>
            <option value="time-desc">Prep time ↓</option>
            <option value="rating-desc">Rating ↓</option>
            <option value="rating-asc">Rating ↑</option>
          </select>
        </div>
      </div>

      <section class="featured">
        <div class="feature-pane">
          <div class="feature-meta">
            <span id="featuredCategory">Featured</span>
            <span id="featuredTime">30 min</span>
            <span id="featuredDifficulty">Easy</span>
          </div>
          <h2 id="featuredTitle">Citrus Salmon Bowl</h2>
          <p id="featuredDescription">A bright and balanced bowl with flaky salmon, quinoa, greens, and a lemony dressing.</p>
          <div class="feature-actions">
            <button class="secondary-btn" type="button" id="featuredViewBtn">View recipe</button>
            <button class="secondary-btn" type="button" id="featuredFavoriteBtn">Save favorite</button>
          </div>
        </div>

        <div class="stats-card">
          <div class="stats-grid">
            <div class="stat">
              <strong id="statRecipes">50</strong>
              <span>Recipes</span>
            </div>
            <div class="stat">
              <strong>30m</strong>
              <span>Fastest</span>
            </div>
            <div class="stat">
              <strong>6</strong>
              <span>Categories</span>
            </div>
            <div class="stat">
              <strong>4.8</strong>
              <span>Avg. rating</span>
            </div>
          </div>
        </div>
      </section>

      <section class="utility-area">
        <div class="recent-panel">
          <h3>Recently Viewed</h3>
          <ul id="recentList" class="recent-list"></ul>
        </div>

        <div class="shopping-panel">
          <h3>Shopping List</h3>
          <ul id="shoppingList" class="shopping-list"></ul>
        </div>
      </section>

      <section id="recipeGrid" class="recipe-grid" aria-live="polite"></section>
    </div>

    <div id="recipeModal" class="modal" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" type="button" aria-label="Close recipe details">×</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script>
      const recipes = [
        { id: 'citrus-salmon-bowl', title: 'Citrus Salmon Bowl', category: 'dinner', time: 30, rating: 4.9, icon: '🐟', color: 'teal', description: 'A bright and balanced bowl with flaky salmon, quinoa, greens, and a lemony dressing.', ingredients: ['4 salmon fillets', '1 cup quinoa', '2 cups kale', '1 avocado', '1 orange', '2 tbsp olive oil', '1 lemon', 'Salt and pepper'], method: ['Cook quinoa according to the package directions.', 'Season salmon with salt, pepper, and orange zest.', 'Roast salmon until flaky and toss greens with olive oil.', 'Assemble bowls with quinoa, greens, avocado, and salmon. Finish with lemon juice.'] },
        { id: 'berry-overnight-oats', title: 'Berry Overnight Oats', category: 'breakfast', time: 10, rating: 4.8, icon: '🥣', color: 'blue', description: 'A creamy overnight oat jar with chia, yogurt, and fresh berries.', ingredients: ['1/2 cup rolled oats', '1/2 cup milk', '1/3 cup yogurt', '1 tbsp chia seeds', '1 tsp honey', '1/2 cup berries', 'Pinch of cinnamon'], method: ['Stir oats, milk, yogurt, chia, honey, and cinnamon together.', 'Cover and refrigerate overnight.', 'Top with berries before serving.'] },

        { id: 'roasted-chickpeas', title: 'Roasted Chickpeas', category: 'snack', time: 25, rating: 4.6, icon: '🫘', color: 'sunset', description: 'Crunchy roasted chickpeas with smoky seasoning.', ingredients: ['1 can chickpeas', '1 tbsp olive oil', '1 tsp paprika', '1/2 tsp garlic powder', 'Salt'], method: ['Dry chickpeas well and toss with oil and seasonings.', 'Roast until crunchy.', 'Cool and serve as a snack.'] }
      ];

      const filters = document.querySelectorAll('.filter');
      const recipeGrid = document.getElementById('recipeGrid');
      const searchInput = document.getElementById('searchInput');
      const themeToggle = document.getElementById('themeToggle');
      const favoritesCount = document.getElementById('favoritesCount');
      const modal = document.getElementById('recipeModal');
      const modalContent = document.getElementById('modalContent');
      const featuredTitle = document.getElementById('featuredTitle');
      const featuredCategory = document.getElementById('featuredCategory');
      const featuredTime = document.getElementById('featuredTime');
      const featuredDifficulty = document.getElementById('featuredDifficulty');
      const featuredDescription = document.getElementById('featuredDescription');
      const featuredViewBtn = document.getElementById('featuredViewBtn');
      const featuredFavoriteBtn = document.getElementById('featuredFavoriteBtn');
      const sortSelect = document.getElementById('sortSelect');
      const recentList = document.getElementById('recentList');
      const shoppingList = document.getElementById('shoppingList');

      const state = {
        filter: 'all',
        query: '',
        sort: 'featured',
        favorites: JSON.parse(localStorage.getItem('recipe-box-favorites') || '[]'),
        featuredId: 'citrus-salmon-bowl',
        recent: JSON.parse(localStorage.getItem('recipe-box-recent') || '[]'),
        shopping: JSON.parse(localStorage.getItem('recipe-box-shopping') || '[]')
      };

      function mergeUnique(list, value) {
        const next = [...list];
        const index = next.indexOf(value);
        if (index >= 0) next.splice(index, 1);
        next.unshift(value);
        return next.slice(0, 5);
      }

      function updateFavoritesCount() {
        favoritesCount.textContent = String(state.favorites.length);
      }

      function saveFavorites() {
        localStorage.setItem('recipe-box-favorites', JSON.stringify(state.favorites));
      }

      function saveRecent() {
        localStorage.setItem('recipe-box-recent', JSON.stringify(state.recent));
      }

      function saveShopping() {
        localStorage.setItem('recipe-box-shopping', JSON.stringify(state.shopping));
      }

      function setFeatured() {
        const recipe = recipes.find((entry) => entry.id === state.featuredId) || recipes[0];
        featuredTitle.textContent = recipe.title;
        featuredCategory.textContent = recipe.category.toUpperCase();
        featuredTime.textContent = `${recipe.time} min`;
        featuredDifficulty.textContent = recipe.difficulty;
        featuredDescription.textContent = recipe.description;
        featuredViewBtn.dataset.recipeId = recipe.id;
        featuredFavoriteBtn.dataset.recipeId = recipe.id;
        const favorite = state.favorites.includes(recipe.id);
        featuredFavoriteBtn.textContent = favorite ? 'Saved' : 'Save favorite';
      }

      function renderRecent() {
        const recentRecipes = state.recent
          .map((id) => recipes.find((recipe) => recipe.id === id))
          .filter(Boolean)
          .slice(0, 5);

        recentList.innerHTML = recentRecipes.length
          ? recentRecipes.map((recipe) => `
              <li>
                <span>${recipe.title}</span>
                <button type="button" data-recipe-id="${recipe.id}">Open</button>
              </li>
            `).join('')
          : '<li><span>No recent recipes yet.</span></li>';

        recentList.querySelectorAll('button[data-recipe-id]').forEach((button) => {
          button.addEventListener('click', () => openModal(button.dataset.recipeId));
        });
      }

      function renderShopping() {
        if (!state.shopping.length) {
          shoppingList.innerHTML = '<li><span>No ingredients checked yet.</span></li>';
          return;
        }

        shoppingList.innerHTML = state.shopping.map((item, index) => `
          <li>
            <label class="label">
              <input type="checkbox" data-shopping-index="${index}" checked />
              <span>${item}</span>
            </label>
            <button class="remove" type="button" data-remove-index="${index}" aria-label="Remove ${item}">&times;</button>
          </li>
        `).join('');

        shoppingList.querySelectorAll('[data-shopping-index]').forEach((checkbox) => {
          checkbox.addEventListener('change', (event) => {
            const index = Number(event.target.dataset.shoppingIndex);
            state.shopping.splice(index, 1);
            saveShopping();
            renderShopping();
          });
        });

        shoppingList.querySelectorAll('[data-remove-index]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.dataset.removeIndex);
            state.shopping.splice(index, 1);
            saveShopping();
            renderShopping();
          });
        });
      }

      function getVisibleRecipes() {
        const query = state.query.trim().toLowerCase();

        const filtered = recipes.filter((recipe) => {
          const matchesFilter = state.filter === 'all'
            ? true
            : state.filter === 'favorites'
              ? state.favorites.includes(recipe.id)
              : recipe.category === state.filter;

          const matchesQuery = !query || `${recipe.title} ${recipe.description}`.toLowerCase().includes(query);
          return matchesFilter && matchesQuery;
        });

        switch (state.sort) {
          case 'time-asc':
            return [...filtered].sort((a, b) => a.time - b.time);
          case 'time-desc':
            return [...filtered].sort((a, b) => b.time - a.time);
          case 'rating-desc':
            return [...filtered].sort((a, b) => b.rating - a.rating);
          case 'rating-asc':
            return [...filtered].sort((a, b) => a.rating - b.rating);
          default:
            return filtered;
        }
      }

      function renderCards() {
        const visible = getVisibleRecipes();

        recipeGrid.innerHTML = visible
          .map((recipe) => {
            const isFav = state.favorites.includes(recipe.id);
            const color = recipe.color || 'gold';
            return `
              <article class="recipe-card is-visible" data-id="${recipe.id}" data-category="${recipe.category}" data-name="${recipe.title}" data-color="${color}">
                <div class="card-actions">
                  <button class="favorite-btn ${isFav ? 'is-favorited' : ''}" type="button" aria-label="Favorite ${recipe.title}" data-recipe-id="${recipe.id}">${isFav ? '♥' : '♡'}</button>
                </div>
                <div class="recipe-visual" aria-hidden="true">${recipe.icon}</div>
                <div class="recipe-info">
                  <div class="recipe-meta">
                    <span class="tag" data-category-tag="${recipe.category}">${recipe.category}</span>
                    <span>${recipe.time} min</span>
                    <span>${recipe.difficulty || 'Easy'}</span>
                    <span>★ ${recipe.rating}</span>
                  </div>
                  <h3>${recipe.title}</h3>
                  <p>${recipe.description}</p>
                  <div class="card-buttons">
                    <button class="view-btn" type="button" data-recipe-id="${recipe.id}">View recipe</button>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');

        attachCardEvents();
        applyCategoryColors();
      }

      function applyCategoryColors() {
        document.querySelectorAll('[data-category-tag]').forEach((tag) => {
          const category = tag.dataset.categoryTag;
          const colors = {
            breakfast: '#f3c76d',
            lunch: '#8ec7a4',
            dinner: '#e89068',
            vegetarian: '#9ad38a',
            dessert: '#d9a4c8',
            snack: '#a7baf5'
          };
          tag.style.background = colors[category] || '#f1d1ad';
          tag.style.color = '#1f1a17';
        });
      }

      function attachCardEvents() {
        document.querySelectorAll('.favorite-btn').forEach((button) => {
          button.addEventListener('click', () => toggleFavorite(button.dataset.recipeId));
        });

        document.querySelectorAll('.view-btn').forEach((button) => {
          button.addEventListener('click', () => openModal(button.dataset.recipeId));
        });
      }

      function toggleFavorite(recipeId) {
        const index = state.favorites.indexOf(recipeId);
        if (index >= 0) {
          state.favorites.splice(index, 1);
        } else {
          state.favorites.push(recipeId);
        }
        saveFavorites();
        updateFavoritesCount();
        setFeatured();
        renderCards();
      }

      function openModal(recipeId) {
        const recipe = recipes.find((item) => item.id === recipeId);
        if (!recipe) return;

        state.recent = mergeUnique(state.recent, recipeId);
        saveRecent();
        renderRecent();

        modalContent.innerHTML = `
          <div class="modal-header">
            <div class="modal-meta">
              <span>${recipe.category}</span>
              <span>${recipe.time} min</span>
              <span>${recipe.difficulty || 'Easy'}</span>
              <span>★ ${recipe.rating}</span>
            </div>
            <h2 id="modalTitle">${recipe.title}</h2>
          </div>
          <div class="modal-body">
            <div>
              <h3>Ingredients</h3>
              <ul class="ingredient-list">
                ${recipe.ingredients.map((item) => `
                  <li>
                    <input type="checkbox" aria-label="Ingredient: ${item}" data-shopping-item="${item}" />
                    <label>${item}</label>
                  </li>
                `).join('')}
              </ul>
              <div style="margin-top: 14px;">
                <button class="shop-toggle" type="button" data-add-shopping="${recipe.id}">Add checked ingredients to shopping list</button>
              </div>
            </div>
            <div>
              <h3>Method</h3>
              <ol>
                ${recipe.method.map((step) => `<li>${step}</li>`).join('')}
              </ol>
            </div>
          </div>
        `;

        modal.hidden = false;

        modalContent.querySelectorAll('[data-shopping-item]').forEach((input) => {
          input.addEventListener('change', () => {
            if (input.checked) {
              const value = input.dataset.shoppingItem;
              if (!state.shopping.includes(value)) {
                state.shopping.push(value);
                saveShopping();
                renderShopping();
              }
            }
          });
        });

        const shopBtn = modalContent.querySelector('[data-add-shopping]');
        if (shopBtn) {
          shopBtn.addEventListener('click', () => {
            const checked = [...modalContent.querySelectorAll('[data-shopping-item]:checked')].map((input) => input.dataset.shoppingItem);
            checked.forEach((item) => {
              if (!state.shopping.includes(item)) {
                state.shopping.push(item);
              }
            });
            saveShopping();
            renderShopping();
          });
        }
      }

      function closeModal() {
        modal.hidden = true;
      }

      filters.forEach((button) => {
        button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          filters.forEach((btn) => btn.classList.toggle('is-active', btn === button));
          renderCards();
        });
      });

      searchInput.addEventListener('input', (event) => {
        state.query = event.target.value;
        renderCards();
      });

      sortSelect.addEventListener('change', (event) => {
        state.sort = event.target.value;
        renderCards();
      });

      document.getElementById('themeToggle').addEventListener('click', () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const nextTheme = isDark ? 'light' : 'dark';
        document.body.setAttribute('data-theme', nextTheme);
        localStorage.setItem('recipe-box-theme', nextTheme);
        themeToggle.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
      });

      const savedTheme = localStorage.getItem('recipe-box-theme');
      if (savedTheme === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '☀️';
      }

      featuredViewBtn.addEventListener('click', () => openModal(featuredViewBtn.dataset.recipeId));
      featuredFavoriteBtn.addEventListener('click', () => toggleFavorite(featuredFavoriteBtn.dataset.recipeId));
      document.querySelector('.modal-backdrop').addEventListener('click', closeModal);
      document.querySelector('.modal-close').addEventListener('click', closeModal);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !modal.hidden) closeModal();
      });

      updateFavoritesCount();
      renderRecent();
      renderShopping();
      setFeatured();
      renderCards();
    </script>
  </body>
</html>

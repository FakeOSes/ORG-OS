<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT for ORG-OS</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#f0f3f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 0%,#243a32 0,transparent 55%),#0d1117}
main{width:min(560px,100%);padding:clamp(24px,5vw,46px);border:1px solid #ffffff1c;border-radius:28px;background:#111821e8;box-shadow:0 28px 90px #0006;text-align:center}
.mark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border:1px solid #ffffff24;border-radius:24px;background:linear-gradient(145deg,#263b33,#131b19);font-size:44px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;color:#9fb8a9;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.055em;margin:10px 0}
p{color:#aab6c4;line-height:1.7;font-size:14px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 16px}
button,a{font:inherit;text-decoration:none;cursor:pointer;border-radius:12px;padding:13px 18px;font-weight:750}
.primary{border:0;background:#f0f5f1;color:#111b16}
.secondary{border:1px solid #ffffff24;background:#ffffff08;color:#edf4ef}
.note{font-size:11px;color:#758596;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">✳</div>
<div class="eyebrow">ORG-OS APP</div>
<h1>ChatGPT</h1>
<p>Your AI assistant for brainstorming, learning, writing, coding, and exploring ideas. Sign in using the official ChatGPT website.</p>
<div class="actions">
<button class="primary" id="launch" type="button">Open ChatGPT ↗</button>
<a class="secondary" href="https://help.openai.com/" target="_blank" rel="noopener noreferrer">Help center</a>
</div>
<p class="note">For account safety, sign-in opens on chatgpt.com rather than inside this app window.</p>
</main>
<script>
document.getElementById("launch").addEventListener("click",function(){window.open("https://chatgpt.com/","_blank","noopener,noreferrer");});
</script>
</body>
</html>

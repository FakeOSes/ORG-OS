<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Vault</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:15px system-ui,sans-serif;color:#e7edf8;background:#111827}h1{margin:0 0 8px;font-size:26px}p{color:#aebbd0;line-height:1.5}input,textarea,button{font:inherit;border:1px solid #36445a;border-radius:9px;padding:10px;background:#1b2638;color:#f8fafc;margin:4px 3px 8px 0}input,textarea{max-width:100%}button{cursor:pointer;background:#253d62}button:hover{background:#31527f}#list p,#board section,details{padding:12px;border:1px solid #344258;border-radius:10px;margin:8px 0}a{color:#93c5fd}#preview{padding:30px;border-radius:12px;margin:14px 0;font-size:22px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols textarea{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:10px}@media(max-width:600px){body{padding:16px}.cols{grid-template-columns:1fr}}</style><body><h1>🔗 Link Vault</h1><p>Save links you want to find again.</p><form id="add"><input id="label" placeholder="Link title" required><input id="url" type="url" placeholder="https://example.com" required><button>Save link</button></form><input id="search" placeholder="Search saved links"><div id="list"></div><script>let items=JSON.parse(localStorage.getItem('org-links')||'[]');function render(){localStorage.setItem('org-links',JSON.stringify(items));list.innerHTML='';items.filter(x=>(x.label+' '+x.url).toLowerCase().includes(search.value.toLowerCase())).forEach((x)=>{let p=document.createElement('p');let a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=x.label+' — '+x.url;let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{items=items.filter(y=>y!==x);render()};p.append(a,b);list.append(p)})}add.onsubmit=e=>{e.preventDefault();items.push({label:label.value,url:url.value});label.value='';url.value='';render()};search.oninput=render;render()</script></body></html>

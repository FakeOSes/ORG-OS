<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Journal</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:15px system-ui,sans-serif;color:#e7edf8;background:#111827}h1{margin:0 0 8px;font-size:26px}p{color:#aebbd0;line-height:1.5}input,textarea,button{font:inherit;border:1px solid #36445a;border-radius:9px;padding:10px;background:#1b2638;color:#f8fafc;margin:4px 3px 8px 0}input,textarea{max-width:100%}button{cursor:pointer;background:#253d62}button:hover{background:#31527f}#list p,#board section,details{padding:12px;border:1px solid #344258;border-radius:10px;margin:8px 0}a{color:#93c5fd}#preview{padding:30px;border-radius:12px;margin:14px 0;font-size:22px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols textarea{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:10px}@media(max-width:600px){body{padding:16px}.cols{grid-template-columns:1fr}}</style><body><h1>📔 Daily Journal</h1><p>Your entries stay in this browser.</p><input id="date" type="date"><textarea id="entry" placeholder="What happened today?" rows="9"></textarea><button id="save">Save entry</button><h2>Saved entries</h2><div id="list"></div><script>let entries=JSON.parse(localStorage.getItem('org-journal')||'{}');date.value=new Date().toISOString().slice(0,10);function render(){list.innerHTML='';Object.keys(entries).sort().reverse().forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{date.value=k;entry.value=entries[k]};list.append(b)})}date.onchange=()=>entry.value=entries[date.value]||'';save.onclick=()=>{entries[date.value]=entry.value;localStorage.setItem('org-journal',JSON.stringify(entries));render()};render()</script></body></html>

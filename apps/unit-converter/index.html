<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Unit Converter · ORG OS</title><style>:root{color-scheme:dark;--bg:#0d1422;--panel:#151f30;--line:#2b394d;--text:#edf3ff;--muted:#9aa9be;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;padding:22px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 95% 0,rgba(96,165,250,.14),transparent 40%),var(--bg);color:var(--text)}h1,h2,p{margin-top:0}h1{font-size:24px;letter-spacing:-.04em;margin-bottom:5px}h2{font-size:16px;margin-bottom:12px}header{margin-bottom:22px}header p,.muted{color:var(--muted);font-size:12px}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:#1a2638;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#08111e;font-weight:700}button.danger{background:#7f1d1d;border-color:#991b1b}input:not([type=checkbox]):not([type=color]):not([type=range]),select,textarea{width:100%;background:#0a111d;border:1px solid var(--line);border-radius:9px;padding:10px;outline-color:var(--accent)}textarea{min-height:180px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.actions,.rowline{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.panel,.result-box,.clockface{padding:18px;border:1px solid var(--line);border-radius:15px;background:rgba(21,31,48,.86);margin:12px 0}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--accent);font-weight:800}.bigtime{font-size:clamp(36px,8vw,60px);font-weight:750;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.number{font-size:28px;font-variant-numeric:tabular-nums}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview{padding:14px;background:#101a29;border:1px solid var(--line);border-radius:10px;min-height:220px;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{margin:12px 0}.preview p{color:#d1dced}.preview code{background:#26364b;padding:2px 4px;border-radius:4px}.notice{padding:10px;border-radius:8px;background:#1e293b;margin:12px 0}.good{color:#86efac}.bad{color:#fca5a5}.colorbox{height:110px;border-radius:14px;background:#60a5fa;margin:10px 0 18px}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}.swatch{height:68px;padding:4px;font-size:10px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats>div{padding:12px;border-radius:10px;background:#101a29;text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;color:var(--muted)}.prompt{padding:14px;border-radius:10px;background:#101a29;line-height:1.8}.track{height:7px;background:#29374a;border-radius:9px;overflow:hidden;margin:18px 0}.track>div{height:100%;width:0;background:var(--accent);transition:width .2s}.modes{justify-content:flex-start}.keylist{display:grid;gap:6px;margin:12px 0}.keyrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:0}.keyrow input{width:auto}.keyrow span{overflow-wrap:anywhere;flex:1;color:var(--text)}.keyrow small{color:var(--muted)}.calc{max-width:420px;margin:auto}.display{padding:18px 12px;text-align:right;font-size:34px;overflow-wrap:anywhere;background:#070d16;border-radius:12px}.history{text-align:right;color:var(--muted);font-size:12px;height:22px;margin:6px 0}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{font-size:18px;padding:14px 5px}.keys .operator{background:#23334a}.keys .primary{background:var(--accent)}@media(max-width:480px){body{padding:14px}.split{grid-template-columns:1fr}.stats strong{font-size:18px}}</style></head><body><header><h1>📐 Unit Converter</h1><p>Convert common length, weight, and temperature units.</p></header><main><label for="kind">Conversion type</label><select id="kind"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select><div class="split"><div><label for="amount">Value</label><input id="amount" type="number" value="1"></div><div><label for="from">From</label><select id="from"></select></div><div><label for="to">To</label><select id="to"></select></div></div><div class="result-box"><div class="eyebrow">RESULT</div><div id="result" class="bigtime">0.3048</div></div><button id="swap">Swap units ⇄</button></main><script>const units={length:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Mile:1609.344,Yard:.9144,Foot:.3048,Inch:.0254},weight:{Kilogram:1,Gram:.001,Milligram:.000001,Pound:.45359237,Ounce:.0283495},temp:{Celsius:1,Fahrenheit:1,Kelvin:1}};const $=id=>document.getElementById(id);function fill(){const k=$("kind").value;["from","to"].forEach(id=>{$(id).innerHTML="";Object.keys(units[k]).forEach(n=>$(id).add(new Option(n,n)))});$("from").selectedIndex=0;$("to").selectedIndex=Math.min(1,$("to").options.length-1);convert()}function convert(){const k=$("kind").value,v=Number($("amount").value)||0,a=$("from").value,b=$("to").value;let x;if(k==="temp"){const c=a==="Celsius"?v:a==="Fahrenheit"?(v-32)*5/9:v-273.15;x=b==="Celsius"?c:b==="Fahrenheit"?c*9/5+32:c+273.15}else x=v*units[k][a]/units[k][b];$("result").textContent=Number(x.toPrecision(9)).toLocaleString()}$("kind").onchange=fill;["amount","from","to"].forEach(id=>$(id).addEventListener("input",convert));$("swap").onclick=()=>{const a=$("from").value;$("from").value=$("to").value;$("to").value=a;convert()};fill();</script></body></html>

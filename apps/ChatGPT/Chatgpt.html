<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Simple Integration</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-container { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>ChatGPT Integration</h2>
    <input type="password" id="api-key" placeholder="Enter your OpenAI API Key" />
    <div id="chat-container"></div>
    <input type="text" id="user-input" placeholder="Type your message here..." />
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const apiKey = document.getElementById('api-key').value;
            const userInput = document.getElementById('user-input').value;
            const chatContainer = document.getElementById('chat-container');

            if (!apiKey || !userInput) return alert('Please enter API key and message.');

            chatContainer.innerHTML += `<div><b>You:</b> ${userInput}</div>`;
            document.getElementById('user-input').value = '';

            try {
                const response = await fetch('https://openai.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [{ role: 'user', content: userInput }]
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;
                chatContainer.innerHTML += `<div><b>ChatGPT:</b> ${reply}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                chatContainer.innerHTML += `<div style="color:red;">Error: Could not reach API.</div>`;
            }
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regex Playground · ORG OS</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#141e30;--line:#29374d;--muted:#9caec4;--text:#f2f6fc;--accent:#c084fc}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.glyph{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 18%,var(--panel));font-size:28px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}h1{font-size:24px;letter-spacing:-.7px;margin:0}header p{margin:3px 0 0;color:var(--muted)}section,.panel{background:#141e30dd;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;min-width:0}h2{font-size:14px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input,textarea,select{width:100%;min-width:0;background:#0b1322;color:var(--text);border:1px solid #34445c;border-radius:9px;padding:10px 11px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical}button{background:var(--accent);color:#08111f;border:0;border-radius:9px;padding:10px 14px;font:600 13px inherit;cursor:pointer}button.secondary{background:#26364e;color:var(--text);border:1px solid #3a4a61}button.danger{background:#512d3a;color:#ffdbe2}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.status{color:var(--muted);font-size:12px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#24364d;color:#c6d7ec;font-size:11px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#09111e;border:1px solid var(--line);border-radius:10px;padding:13px;min-height:50px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:#a9bed7} @media(max-width:600px){body{padding:14px}header{align-items:flex-start}h1{font-size:20px}}
</style><style id="org-app-finish">
:root{--accent:#4f7cff;--soft:#eaf0ff;--line:#dfe5ef;--shadow:0 12px 32px rgba(24,39,75,.08)}
body{padding:clamp(14px,2.1vw,28px);background:radial-gradient(ellipse at 0 0,rgba(79,124,255,.08),transparent 48%),var(--bg);font-size:14px;line-height:1.5}
header{gap:14px;padding:0 0 18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
header .appicon{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--soft),var(--panel));border:1px solid var(--line);box-shadow:0 5px 16px rgba(45,65,110,.08)}
header h1{font-size:clamp(20px,2.2vw,25px);letter-spacing:-.035em;font-weight:750}
header p{font-size:12px;line-height:1.4}
.toolbar{gap:8px;margin:14px 0 20px}
button,.filebtn{min-height:36px;border-radius:10px;box-shadow:0 1px 2px rgba(20,35,60,.035);transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease}
button:hover,.filebtn:hover{box-shadow:0 5px 14px rgba(38,66,120,.09);transform:translateY(-1px)}
button:active,.filebtn:active{transform:translateY(0) scale(.985)}
button.primary{background:linear-gradient(135deg,var(--accent),#354fba);box-shadow:0 5px 13px rgba(79,124,255,.2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(79,124,255,.35);outline-offset:2px}
input:not([type=checkbox]):not([type=range]):not([type=color]),select,textarea{max-width:100%;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):not([type=range]):not([type=color]):focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.12);outline:0}
.panel,.widget,.card,.metric-card,.stat-card,.calendar-panel,.paint-panel,.photo-panel,.player-panel,.weather-panel{border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.panel,.widget{padding:clamp(13px,1.6vw,20px)}
small,.muted,.subtitle{line-height:1.45}
canvas,img{max-width:100%;border-radius:10px}
hr{border:0;border-top:1px solid var(--line)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(104,114,134,.38);border:3px solid transparent;background-clip:padding-box;border-radius:99px}
@media(max-width:620px){body{padding:13px}header{gap:10px;padding-bottom:13px;margin-bottom:15px}header .appicon{width:42px;height:42px}header h1{font-size:19px}.toolbar{margin:10px 0 14px}.toolbar button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body><main><header><div class="glyph">⌘</div><div><h1>Regex Playground</h1><p>Test patterns against sample text and inspect every match.</p></div></header>
<section class="grid"><div><label for="pattern">Regular expression</label><input id="pattern" value="\\bORG\\b" spellcheck="false"></div><div><label for="flags">Flags</label><select id="flags"><option value="g">g · all matches</option><option value="gi">gi · case-insensitive</option><option value="gm">gm · multiline</option><option value="gims">gims · all common flags</option><option value="i">i · first match, case-insensitive</option><option value="">none · first match</option></select></div></section><section><label for="source">Test text</label><textarea id="source" rows="7" spellcheck="false">Welcome to ORG OS. ORG OS has apps, windows, and tools.</textarea><div class="row" style="margin-top:12px"><span id="status" class="status">Ready</span><button id="run">Test pattern</button></div></section><section><h2>Highlighted matches</h2><div id="highlight" class="result"></div></section><section><h2>Match details</h2><div id="matches" class="result">Your matches will appear here.</div></section><script>
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function run(){let p=$('pattern').value,t=$('source').value,f=$('flags').value;try{let re=new RegExp(p,f),found=[],m;if(re.global){while((m=re.exec(t))&&found.length<500){found.push({value:m[0],index:m.index,groups:m.slice(1)});if(!m[0].length)re.lastIndex++;}}else{m=re.exec(t);if(m)found.push({value:m[0],index:m.index,groups:m.slice(1)});}let html='',last=0;found.forEach(x=>{html+=esc(t.slice(last,x.index))+'<mark>'+esc(x.value)+'</mark>';last=x.index+x.value.length;});html+=esc(t.slice(last));$('highlight').innerHTML=html||'<span class="muted">No matches found.</span>';$('matches').textContent=found.length?found.map((x,i)=>(i+1)+'. "'+x.value+'" at index '+x.index+(x.groups.length?' · groups: '+JSON.stringify(x.groups):'')).join('\n'):'No matches.';$('status').textContent=found.length+' match'+(found.length===1?'':'es');}catch(e){$('status').textContent='Invalid pattern: '+e.message;$('highlight').textContent='Fix the pattern to see results.';$('matches').textContent=e.message;}}
$('run').onclick=run;['pattern','flags','source'].forEach(id=>$(id).addEventListener('input',run));run();
</script><style>mark{background:#d8b4fe;color:#26113d;border-radius:3px;padding:1px 2px}</style></main></body></html>

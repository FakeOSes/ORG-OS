<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrast Checker</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:15px system-ui,sans-serif;color:#e7edf8;background:#111827}h1{margin:0 0 8px;font-size:26px}p{color:#aebbd0;line-height:1.5}input,textarea,button{font:inherit;border:1px solid #36445a;border-radius:9px;padding:10px;background:#1b2638;color:#f8fafc;margin:4px 3px 8px 0}input,textarea{max-width:100%}button{cursor:pointer;background:#253d62}button:hover{background:#31527f}#list p,#board section,details{padding:12px;border:1px solid #344258;border-radius:10px;margin:8px 0}a{color:#93c5fd}#preview{padding:30px;border-radius:12px;margin:14px 0;font-size:22px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols textarea{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:10px}@media(max-width:600px){body{padding:16px}.cols{grid-template-columns:1fr}}</style><body><h1>🌓 Contrast Checker</h1><p>Preview a text/background color pair.</p><label>Text color <input id="fg" type="color" value="#ffffff"></label> <label>Background <input id="bg" type="color" value="#1e293b"></label><div id="preview">The quick brown fox jumps over the lazy dog.</div><h2 id="ratio"></h2><script>function lum(hex){let c=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]}function render(){preview.style.color=fg.value;preview.style.background=bg.value;let a=lum(fg.value),b=lum(bg.value),r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);ratio.textContent='Contrast ratio: '+r.toFixed(2)+':1 · '+(r>=7?'AAA normal text':r>=4.5?'AA normal text':'Needs more contrast')}fg.oninput=bg.oninput=render;render()</script></body></html>

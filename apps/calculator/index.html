<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101827">
  <title>Calculator · ORG OS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1220;
      --panel: #151e2f;
      --panel-raised: #1b2639;
      --line: #2a3850;
      --text: #eef3ff;
      --muted: #9aa8be;
      --accent: #6a9cff;
      --accent-strong: #4f7cff;
      --danger: #ff8e9b;
      --shadow: 0 18px 48px rgba(0, 0, 0, .24);
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: inherit; }
    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(16px, 3vw, 32px);
      color: var(--text);
      background: radial-gradient(ellipse at 10% 0, rgba(79,124,255,.14), transparent 42%), var(--bg);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .app { max-width: 820px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .app-icon {
      display: grid; width: 48px; height: 48px; flex: 0 0 auto; place-items: center;
      border: 1px solid var(--line); border-radius: 15px;
      background: linear-gradient(145deg, #253958, var(--panel)); font-size: 24px;
      box-shadow: 0 6px 18px rgba(0,0,0,.18);
    }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 25px); letter-spacing: -.035em; }
    .header p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 18px; align-items: start; }
    .calculator, .history-panel {
      border: 1px solid var(--line); border-radius: 18px; background: rgba(21,30,47,.94); box-shadow: var(--shadow);
    }
    .calculator { padding: clamp(14px, 2.5vw, 22px); }
    .screen {
      display: flex; min-height: 116px; flex-direction: column; justify-content: flex-end;
      padding: 17px 18px; overflow: hidden; border: 1px solid #26354d; border-radius: 14px;
      background: linear-gradient(145deg, #0c1422, #111b2b); text-align: right;
    }
    .expression { min-height: 22px; overflow-wrap: anywhere; color: var(--muted); font-size: 14px; }
    .result {
      min-height: 49px; overflow-wrap: anywhere; font-size: clamp(32px, 8vw, 46px);
      font-weight: 650; letter-spacing: -.045em; font-variant-numeric: tabular-nums;
    }
    .result.error { color: var(--danger); font-size: clamp(21px, 5vw, 28px); letter-spacing: -.02em; }
    .controls { display: flex; justify-content: space-between; gap: 8px; margin: 14px 0 10px; }
    .control-group { display: flex; gap: 8px; }
    .key {
      min-width: 0; min-height: 54px; border: 1px solid var(--line); border-radius: 12px;
      color: var(--text); background: var(--panel-raised); cursor: pointer;
      font-size: 20px; font-weight: 550; transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
      touch-action: manipulation;
    }
    .key:hover { border-color: #506887; background: #24334a; box-shadow: 0 5px 14px rgba(0,0,0,.16); }
    .key:active { transform: scale(.97); }
    .key:focus-visible, .history-item:focus-visible, .clear-history:focus-visible {
      outline: 3px solid rgba(106,156,255,.55); outline-offset: 2px;
    }
    .key.utility { min-height: 40px; padding: 0 13px; color: #c5d3eb; font-size: 13px; }
    .key.operator { color: #b7ceff; background: #202e45; }
    .key.danger { color: #ffb1ba; }
    .key.equals { border-color: transparent; color: #081326; background: linear-gradient(135deg, #8cb4ff, #5b86f5); font-weight: 750; }
    .key.equals:hover { background: linear-gradient(135deg, #a4c4ff, #7097ff); }
    .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .history-panel { padding: 17px; }
    .history-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .history-heading h2 { margin: 0; font-size: 14px; }
    .clear-history { padding: 4px 0; border: 0; color: var(--muted); background: none; cursor: pointer; font-size: 12px; }
    .clear-history:hover { color: var(--text); }
    .history-list { display: grid; gap: 7px; max-height: 350px; overflow: auto; }
    .history-empty { margin: 0; padding: 12px 0; color: var(--muted); font-size: 12px; }
    .history-item {
      display: block; width: 100%; padding: 9px 10px; overflow: hidden; border: 1px solid transparent;
      border-radius: 10px; color: var(--text); background: #101a29; cursor: pointer; text-align: right;
    }
    .history-item:hover { border-color: var(--line); background: #19263a; }
    .history-expression { display: block; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .history-value { display: block; margin-top: 2px; font-size: 16px; font-variant-numeric: tabular-nums; }
    .hint { margin: 13px 2px 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 640px) {
      body { padding: 16px 12px; }
      .header { margin-bottom: 17px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .history-panel { padding: 13px 15px; }
      .history-list { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 190px; }
      .key { min-height: 52px; }
    }
    @media (max-width: 360px) { .keys { gap: 6px; } .key { min-height: 48px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="app-icon" aria-hidden="true">🧮</div>
      <div><h1>Calculator</h1><p>A handy calculator with history and keyboard support.</p></div>
    </header>
    <main class="layout">
      <section class="calculator" aria-label="Calculator">
        <div class="screen" aria-live="polite" aria-atomic="true">
          <div class="expression" id="expression" aria-label="Expression"></div>
          <div class="result" id="result">0</div>
        </div>
        <div class="controls">
          <div class="control-group">
            <button class="key utility danger" type="button" data-action="clear" aria-label="Clear all">AC</button>
            <button class="key utility" type="button" data-value="(" aria-label="Open parenthesis">(</button>
            <button class="key utility" type="button" data-value=")" aria-label="Close parenthesis">)</button>
            <button class="key utility" type="button" data-value="%" aria-label="Percent">%</button>
          </div>
          <button class="key utility" type="button" data-action="backspace" aria-label="Delete last character">⌫</button>
        </div>
        <div class="keys" aria-label="Calculator keys">
          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button class="key operator" type="button" data-value="/" aria-label="Divide">÷</button>
          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button class="key operator" type="button" data-value="*" aria-label="Multiply">×</button>
          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button class="key operator" type="button" data-value="-" aria-label="Subtract">−</button>
          <button class="key" type="button" data-value="0">0</button>
          <button class="key" type="button" data-value=".">.</button>
          <button class="key equals" type="button" data-action="equals" aria-label="Equals">=</button>
          <button class="key operator" type="button" data-value="+" aria-label="Add">+</button>
        </div>
        <p class="hint">Keyboard: 0–9, + − * /, %, parentheses, Enter, Backspace, Esc</p>
      </section>
      <aside class="history-panel" aria-labelledby="history-title">
        <div class="history-heading">
          <h2 id="history-title">Recent calculations</h2>
          <button class="clear-history" type="button" id="clear-history">Clear</button>
        </div>
        <div class="history-list" id="history-list"></div>
      </aside>
    </main>
  </div>
  <script>
    (() => {
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      const historyEl = document.getElementById('history-list');
      const historyKey = 'org-os-calculator-history';
      let expression = '';
      let justEvaluated = false;
      let history = loadHistory();

      function loadHistory() {
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          return Array.isArray(saved) ? saved.filter(item => item && typeof item.expression === 'string' && typeof item.value === 'string').slice(0, 12) : [];
        } catch { return []; }
      }

      function saveHistory() {
        try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch { /* Storage may be unavailable. */ }
      }

      function formatNumber(value) {
        if (!Number.isFinite(value)) throw new Error('Result is out of range');
        return String(Number(value.toPrecision(12)));
      }

      function calculate(source) {
        const tokens = [];
        let input = source.replace(/[×]/g, '*').replace(/[÷]/g, '/').replace(/[−]/g, '-');
        while (input.length) {
          input = input.trimStart();
          if (!input) break;
          const match = input.match(/^(?:\d+(?:\.\d*)?|\.\d+|[()+\-*/%])/);
          if (!match) throw new Error('Invalid expression');
          tokens.push(match[0]);
          input = input.slice(match[0].length);
        }
        let position = 0;
        const peek = () => tokens[position];
        const checked = n => {
          if (!Number.isFinite(n)) throw new Error('Result is out of range');
          return n;
        };
        function primary() {
          const token = tokens[position++];
          if (token === '(') {
            const value = sum();
            if (tokens[position++] !== ')') throw new Error('Missing closing parenthesis');
            return value;
          }
          if (token === undefined || !/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token)) throw new Error('Incomplete expression');
          return Number(token);
        }
        function unary() {
          if (peek() === '+') { position++; return unary(); }
          if (peek() === '-') { position++; return -unary(); }
          let value = primary();
          while (peek() === '%') { position++; value /= 100; }
          return value;
        }
        function product() {
          let value = unary();
          while (peek() === '*' || peek() === '/') {
            const operator = tokens[position++];
            const right = unary();
            if (operator === '/' && right === 0) throw new Error('Cannot divide by zero');
            value = checked(operator === '*' ? value * right : value / right);
          }
          return value;
        }
        function sum() {
          let value = product();
          while (peek() === '+' || peek() === '-') {
            const operator = tokens[position++];
            const right = product();
            value = checked(operator === '+' ? value + right : value - right);
          }
          return value;
        }
        if (!tokens.length) throw new Error('Enter an expression');
        const value = sum();
        if (position !== tokens.length) throw new Error('Invalid expression');
        return value;
      }

      function render() {
        expressionEl.textContent = expression.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
        resultEl.classList.remove('error');
        if (!expression) { resultEl.textContent = '0'; return; }
        try { resultEl.textContent = formatNumber(calculate(expression)); }
        catch (error) {
          if (error.message === 'Cannot divide by zero' || error.message === 'Result is out of range') {
            resultEl.textContent = error.message;
            resultEl.classList.add('error');
          } else resultEl.textContent = '…';
        }
      }

      function renderHistory() {
        historyEl.replaceChildren();
        if (!history.length) {
          const empty = document.createElement('p');
          empty.className = 'history-empty';
          empty.textContent = 'Your calculations will appear here.';
          historyEl.append(empty);
          return;
        }
        history.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'history-item';
          button.setAttribute('aria-label', `${item.expression} equals ${item.value}. Use result`);
          const original = document.createElement('span');
          original.className = 'history-expression';
          original.textContent = item.expression;
          const value = document.createElement('span');
          value.className = 'history-value';
          value.textContent = `= ${item.value}`;
          button.append(original, value);
          button.addEventListener('click', () => { expression = item.value; justEvaluated = true; render(); });
          historyEl.append(button);
        });
      }

      function evaluate() {
        if (!expression) return;
        try {
          const value = formatNumber(calculate(expression));
          history.unshift({ expression: expression.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−'), value });
          history = history.slice(0, 12);
          saveHistory();
          renderHistory();
          expression = value;
          justEvaluated = true;
          render();
        } catch (error) {
          resultEl.textContent = error.message === 'Cannot divide by zero' || error.message === 'Result is out of range' ? error.message : 'Check expression';
          resultEl.classList.add('error');
        }
      }

      function appendValue(value) {
        if (justEvaluated) {
          if (/^[0-9.]$/.test(value)) expression = '';
          justEvaluated = false;
        }
        const last = expression.slice(-1);
        if (/^[0-9.]$/.test(value) && (last === ')' || last === '%')) expression += '*';
        if (value === '(' && (/[0-9.)%]$/.test(expression))) expression += '*';
        if (value === '.' && (last === ')' || last === '%')) expression += '*0';
        if (value === '.') {
          const current = expression.split(/[+\-*/()%]/).pop();
          if (current.includes('.')) return;
          if (!current) expression += '0';
        }
        expression += value;
        render();
      }

      function handleButton(button) {
        const action = button.dataset.action;
        const value = button.dataset.value;
        if (action === 'clear') { expression = ''; justEvaluated = false; render(); return; }
        if (action === 'backspace') { expression = expression.slice(0, -1); justEvaluated = false; render(); return; }
        if (action === 'equals') { evaluate(); return; }
        if (value === '+' || value === '-' || value === '*' || value === '/') {
          if (justEvaluated) justEvaluated = false;
          if (!expression && value !== '-') return;
          expression += value;
          render();
          return;
        }
        if (value === '%' && !/[0-9.)%]$/.test(expression)) return;
        appendValue(value);
      }

      document.querySelectorAll('[data-value], [data-action]').forEach(button => {
        button.addEventListener('click', () => handleButton(button));
      });
      document.getElementById('clear-history').addEventListener('click', () => {
        history = [];
        saveHistory();
        renderHistory();
      });
      document.addEventListener('keydown', event => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (/^[0-9.]$/.test(event.key)) { event.preventDefault(); appendValue(event.key); }
        else if (['+', '-', '*', '/'].includes(event.key)) { event.preventDefault(); handleButton({ dataset: { value: event.key } }); }
        else if (event.key === '%') { event.preventDefault(); handleButton({ dataset: { value: '%' } }); }
        else if (event.key === '(' || event.key === ')') { event.preventDefault(); appendValue(event.key); }
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); evaluate(); }
        else if (event.key === 'Backspace') { event.preventDefault(); handleButton({ dataset: { action: 'backspace' } }); }
        else if (event.key === 'Escape' || event.key === 'Delete') { event.preventDefault(); handleButton({ dataset: { action: 'clear' } }); }
      });

      render();
      renderHistory();
    })();
  </script>
</body>
</html>

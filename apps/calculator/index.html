<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Calculator · ORG OS</title><style>:root{color-scheme:dark;--bg:#0d1422;--panel:#151f30;--line:#2b394d;--text:#edf3ff;--muted:#9aa9be;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;padding:22px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 95% 0,rgba(96,165,250,.14),transparent 40%),var(--bg);color:var(--text)}h1,h2,p{margin-top:0}h1{font-size:24px;letter-spacing:-.04em;margin-bottom:5px}h2{font-size:16px;margin-bottom:12px}header{margin-bottom:22px}header p,.muted{color:var(--muted);font-size:12px}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:#1a2638;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#08111e;font-weight:700}button.danger{background:#7f1d1d;border-color:#991b1b}input:not([type=checkbox]):not([type=color]):not([type=range]),select,textarea{width:100%;background:#0a111d;border:1px solid var(--line);border-radius:9px;padding:10px;outline-color:var(--accent)}textarea{min-height:180px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.actions,.rowline{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.panel,.result-box,.clockface{padding:18px;border:1px solid var(--line);border-radius:15px;background:rgba(21,31,48,.86);margin:12px 0}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--accent);font-weight:800}.bigtime{font-size:clamp(36px,8vw,60px);font-weight:750;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.number{font-size:28px;font-variant-numeric:tabular-nums}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview{padding:14px;background:#101a29;border:1px solid var(--line);border-radius:10px;min-height:220px;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{margin:12px 0}.preview p{color:#d1dced}.preview code{background:#26364b;padding:2px 4px;border-radius:4px}.notice{padding:10px;border-radius:8px;background:#1e293b;margin:12px 0}.good{color:#86efac}.bad{color:#fca5a5}.colorbox{height:110px;border-radius:14px;background:#60a5fa;margin:10px 0 18px}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}.swatch{height:68px;padding:4px;font-size:10px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats>div{padding:12px;border-radius:10px;background:#101a29;text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;color:var(--muted)}.prompt{padding:14px;border-radius:10px;background:#101a29;line-height:1.8}.track{height:7px;background:#29374a;border-radius:9px;overflow:hidden;margin:18px 0}.track>div{height:100%;width:0;background:var(--accent);transition:width .2s}.modes{justify-content:flex-start}.keylist{display:grid;gap:6px;margin:12px 0}.keyrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:0}.keyrow input{width:auto}.keyrow span{overflow-wrap:anywhere;flex:1;color:var(--text)}.keyrow small{color:var(--muted)}.calc{max-width:420px;margin:auto}.display{padding:18px 12px;text-align:right;font-size:34px;overflow-wrap:anywhere;background:#070d16;border-radius:12px}.history{text-align:right;color:var(--muted);font-size:12px;height:22px;margin:6px 0}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{font-size:18px;padding:14px 5px}.keys .operator{background:#23334a}.keys .primary{background:var(--accent)}@media(max-width:480px){body{padding:14px}.split{grid-template-columns:1fr}.stats strong{font-size:18px}}</style></head><body><header><h1>🧮 Calculator</h1><p>A handy calculator with history and keyboard support.</p></header><main><div class="calc"><div id="display" class="display" aria-live="polite">0</div><div id="history" class="history"></div><div class="keys"><button data-k="C" class="operator">C</button><button data-k="⌫" class="operator">⌫</button><button data-k="(" class="">(</button><button data-k=")" class="">)</button><button data-k="7" class="">7</button><button data-k="8" class="">8</button><button data-k="9" class="">9</button><button data-k="÷" class="operator">÷</button><button data-k="4" class="">4</button><button data-k="5" class="">5</button><button data-k="6" class="">6</button><button data-k="×" class="operator">×</button><button data-k="1" class="">1</button><button data-k="2" class="">2</button><button data-k="3" class="">3</button><button data-k="−" class="operator">−</button><button data-k="0" class="">0</button><button data-k="." class="">.</button><button data-k="=" class="primary">=</button><button data-k="+" class="operator">+</button></div></div></main><script>let expr="";const d=document.getElementById("display");function show(){d.textContent=expr||"0"}document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="C")expr="";else if(k==="⌫")expr=expr.slice(0,-1);else if(k==="="){try{const x=expr.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-");if(!/^[0-9+*/().%\s-]+$/.test(x)||!x.trim())throw 0;const result=Function('"use strict";return ('+x+')')();if(!Number.isFinite(result))throw 0;document.getElementById("history").textContent=expr+" = "+result;expr=String(result)}catch{d.textContent="Invalid expression";return}}else expr+=({"÷":"/","×":"*","−":"-"}[k]||k);show()});document.addEventListener("keydown",e=>{if(/^[0-9().%+*/-]$/.test(e.key)){expr+=e.key;show()}else if(e.key==="Enter"){document.querySelector('[data-k="="]').click()}else if(e.key==="Backspace"){expr=expr.slice(0,-1);show()}else if(e.key==="Escape"){expr="";show()}});</script></body></html>

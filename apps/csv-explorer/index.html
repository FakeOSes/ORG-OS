<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Explorer · ORG OS</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#141e30;--line:#29374d;--muted:#9caec4;--text:#f2f6fc;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.glyph{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 18%,var(--panel));font-size:28px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}h1{font-size:24px;letter-spacing:-.7px;margin:0}header p{margin:3px 0 0;color:var(--muted)}section,.panel{background:#141e30dd;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;min-width:0}h2{font-size:14px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input,textarea,select{width:100%;min-width:0;background:#0b1322;color:var(--text);border:1px solid #34445c;border-radius:9px;padding:10px 11px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical}button{background:var(--accent);color:#08111f;border:0;border-radius:9px;padding:10px 14px;font:600 13px inherit;cursor:pointer}button.secondary{background:#26364e;color:var(--text);border:1px solid #3a4a61}button.danger{background:#512d3a;color:#ffdbe2}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.status{color:var(--muted);font-size:12px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#24364d;color:#c6d7ec;font-size:11px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#09111e;border:1px solid var(--line);border-radius:10px;padding:13px;min-height:50px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:#a9bed7} @media(max-width:600px){body{padding:14px}header{align-items:flex-start}h1{font-size:20px}}
</style></head><body><main><header><div class="glyph">▤</div><div><h1>CSV Explorer</h1><p>Open a CSV file, inspect its rows, and get quick column summaries.</p></div></header>
<section><h2>Import data</h2><label for="file">CSV file</label><input id="file" type="file" accept=".csv,text/csv"><p class="status">Runs locally in this window. Your file is not uploaded.</p></section><section><div class="row"><div><h2 id="summary">No file loaded</h2><p class="muted" id="details">Choose a CSV to begin.</p></div><button id="download" class="secondary" disabled>Export cleaned CSV</button></div><div style="overflow:auto;max-height:430px"><table id="table"></table></div></section><section><h2>Column overview</h2><div id="stats" class="grid"></div></section></main></body></html>

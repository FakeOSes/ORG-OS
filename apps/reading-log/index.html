<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Log · ORG OS</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#141e30;--line:#29374d;--muted:#9caec4;--text:#f2f6fc;--accent:#f59e0b}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.glyph{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 18%,var(--panel));font-size:28px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}h1{font-size:24px;letter-spacing:-.7px;margin:0}header p{margin:3px 0 0;color:var(--muted)}section,.panel{background:#141e30dd;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;min-width:0}h2{font-size:14px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input,textarea,select{width:100%;min-width:0;background:#0b1322;color:var(--text);border:1px solid #34445c;border-radius:9px;padding:10px 11px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical}button{background:var(--accent);color:#08111f;border:0;border-radius:9px;padding:10px 14px;font:600 13px inherit;cursor:pointer}button.secondary{background:#26364e;color:var(--text);border:1px solid #3a4a61}button.danger{background:#512d3a;color:#ffdbe2}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.status{color:var(--muted);font-size:12px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#24364d;color:#c6d7ec;font-size:11px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#09111e;border:1px solid var(--line);border-radius:10px;padding:13px;min-height:50px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:#a9bed7} @media(max-width:600px){body{padding:14px}header{align-items:flex-start}h1{font-size:20px}}
</style><style id="org-app-finish">
:root{--accent:#4f7cff;--soft:#eaf0ff;--line:#dfe5ef;--shadow:0 12px 32px rgba(24,39,75,.08)}
body{padding:clamp(14px,2.1vw,28px);background:radial-gradient(ellipse at 0 0,rgba(79,124,255,.08),transparent 48%),var(--bg);font-size:14px;line-height:1.5}
header{gap:14px;padding:0 0 18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
header .appicon{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--soft),var(--panel));border:1px solid var(--line);box-shadow:0 5px 16px rgba(45,65,110,.08)}
header h1{font-size:clamp(20px,2.2vw,25px);letter-spacing:-.035em;font-weight:750}
header p{font-size:12px;line-height:1.4}
.toolbar{gap:8px;margin:14px 0 20px}
button,.filebtn{min-height:36px;border-radius:10px;box-shadow:0 1px 2px rgba(20,35,60,.035);transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease}
button:hover,.filebtn:hover{box-shadow:0 5px 14px rgba(38,66,120,.09);transform:translateY(-1px)}
button:active,.filebtn:active{transform:translateY(0) scale(.985)}
button.primary{background:linear-gradient(135deg,var(--accent),#354fba);box-shadow:0 5px 13px rgba(79,124,255,.2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(79,124,255,.35);outline-offset:2px}
input:not([type=checkbox]):not([type=range]):not([type=color]),select,textarea{max-width:100%;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):not([type=range]):not([type=color]):focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.12);outline:0}
.panel,.widget,.card,.metric-card,.stat-card,.calendar-panel,.paint-panel,.photo-panel,.player-panel,.weather-panel{border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.panel,.widget{padding:clamp(13px,1.6vw,20px)}
small,.muted,.subtitle{line-height:1.45}
canvas,img{max-width:100%;border-radius:10px}
hr{border:0;border-top:1px solid var(--line)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(104,114,134,.38);border:3px solid transparent;background-clip:padding-box;border-radius:99px}
@media(max-width:620px){body{padding:13px}header{gap:10px;padding-bottom:13px;margin-bottom:15px}header .appicon{width:42px;height:42px}header h1{font-size:19px}.toolbar{margin:10px 0 14px}.toolbar button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body><main><header><div class="glyph">📚</div><div><h1>Reading Log</h1><p>Keep a personal bookshelf and track progress through each book.</p></div></header>
<section><h2>Add to your shelf</h2><div class="grid"><div><label for="title">Book title</label><input id="title" placeholder="The book title"></div><div><label for="author">Author</label><input id="author" placeholder="Author name"></div><div><label for="pages">Total pages</label><input id="pages" type="number" min="1" placeholder="280"></div></div><button id="add" style="margin-top:12px">Add book</button><p id="status" class="status">Saved only in this browser.</p></section><section><div class="row"><h2>Your bookshelf</h2><select id="filter" aria-label="Filter books"><option value="all">All books</option><option value="reading">Currently reading</option><option value="finished">Finished</option></select></div><div id="books" class="grid"></div></section><script>
const $=id=>document.getElementById(id);const KEY='org-reading-log';let books=load();function load(){try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(books));render()}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
$('add').onclick=()=>{let title=$('title').value.trim(),author=$('author').value.trim(),pages=Math.floor(Number($('pages').value));if(!title||!pages||pages<1){$('status').textContent='Enter a title and a valid total page count.';return;}books.unshift({id:Date.now(),title,author,pages,read:0});$('title').value='';$('author').value='';$('pages').value='';$('status').textContent='Book added to your shelf.';save();};
$('filter').onchange=render;function render(){let filtered=books.filter(b=>$('filter').value==='all'?true:$('filter').value==='finished'?b.read>=b.pages:b.read<b.pages);$('books').innerHTML=filtered.length?filtered.map(b=>'<article class="panel"><div class="pill">'+(b.read>=b.pages?'Finished':'Reading')+'</div><h2 style="margin-top:10px">'+esc(b.title)+'</h2><p class="muted">'+esc(b.author||'Author not added')+'</p><label>Pages read: <b>'+b.read+'</b> / '+b.pages+'</label><input data-read="'+b.id+'" type="range" min="0" max="'+b.pages+'" value="'+b.read+'"><div class="row" style="margin-top:9px"><small>'+Math.round(b.read/b.pages*100)+'% complete</small><button class="secondary" data-delete="'+b.id+'">Remove</button></div></article>').join(''):'<p class="muted">No books here yet. Add a book above to build your shelf.</p>';document.querySelectorAll('[data-read]').forEach(el=>el.oninput=()=>{let b=books.find(x=>x.id===Number(el.dataset.read));if(b){b.read=Number(el.value);save();}});document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{books=books.filter(b=>b.id!==Number(el.dataset.delete));save();});}
render();
</script></main></body></html>

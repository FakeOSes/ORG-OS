<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ORG Photos — ORG-OS</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--text:#202638;--muted:#687286;--line:#e0e5ef;--accent:#4778f5;--soft:#eaf0ff;--shadow:0 8px 28px #24385a0c}*{box-sizing:border-box}body[data-theme=dark]{color-scheme:dark;--bg:#111722;--panel:#1b2331;--text:#edf2fb;--muted:#aab6c9;--line:#343e50;--accent:#89a7ff;--soft:#293650;--shadow:0 8px 28px #0003}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,sans-serif;padding:22px}button,input,select{font:inherit}button,.filebtn{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--text)}button:hover,.filebtn:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}input:not([type=checkbox]):not([type=range]):not([type=color]),select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}input[type=color]{width:38px;height:32px;border:0;background:transparent}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}header .appicon{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px}header h1{font-size:22px;margin:0}header p{margin:2px 0;color:var(--muted)}header .spacer{flex:1}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.toolbar h2{margin:0 auto 0 0}.panel,.widget{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.widget{margin-top:16px;background:var(--soft);box-shadow:none}.widget p{margin:6px 0 0;color:var(--muted)}h2,h3{margin:0 0 12px}h3{font-size:15px}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:16px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays span{text-align:center;color:var(--muted);padding:8px 0}.day{min-height:56px;text-align:left;border-radius:9px}.day.today{background:var(--soft);border-color:var(--accent);font-weight:800}.day.empty{border:0}.event,.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.event b,.tasktext{flex:1;min-width:0}.event small,.tasktext small{display:block}.tasktext.done{text-decoration:line-through;color:var(--muted)}.task input{accent-color:var(--accent)}.filter.active,.track.selected{background:var(--soft);border-color:var(--accent)}.canvas-wrap{background:#dfe4ed;padding:10px;border-radius:14px;overflow:auto}.canvas-wrap canvas{display:block;max-width:100%;background:white;touch-action:none;border-radius:5px}.hero{display:flex;align-items:center;gap:18px;margin:24px 0}.album{width:110px;height:110px;border-radius:18px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,var(--soft),var(--line))}audio{width:100%}.track{display:block;width:100%;text-align:left;margin:4px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.thumb{padding:7px;text-align:left;min-width:0}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}.thumb span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);max-width:90vw;max-height:90vh}dialog img{max-width:80vw;max-height:65vh;object-fit:contain;display:block}dialog .close{float:right}.weathercard{display:flex;justify-content:space-between;align-items:center;padding:24px;border-radius:20px;background:linear-gradient(135deg,var(--soft),var(--panel));border:1px solid var(--line);margin-bottom:16px}.weathercard h1{font-size:52px;margin:4px 0}.weathericon{font-size:64px}.forecast,.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}.forecastday,.metric{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}.forecastday b{font-size:22px}.metric strong{font-size:18px;overflow-wrap:anywhere}.metric{margin-bottom:16px}.settings{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}@media(max-width:650px){body{padding:14px}.layout{grid-template-columns:1fr}header h1{font-size:19px}.day{min-height:42px;padding:5px}.weathercard{padding:16px}.weathericon{font-size:44px}}

/* ORG-OS app polish: consistent spacing, responsive layouts and keyboard-friendly controls. */
body{padding:clamp(12px,2.2vw,26px);min-width:0;min-height:100%;}
header{flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:clamp(14px,2vw,22px);}
header .appicon{flex:0 0 46px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent);}
header h1{letter-spacing:-.035em;line-height:1.2;}
header p{line-height:1.4;}
button,.filebtn{transition:background .16s,border-color .16s,box-shadow .16s,transform .16s;}
button:focus-visible,.filebtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;}
button:active,.filebtn:active{transform:translateY(1px);}
button:disabled{opacity:.48;cursor:not-allowed;transform:none;}
.panel,.widget{border-radius:16px;box-shadow:var(--shadow);}
.layout{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(12px,1.8vw,18px);}
.toolbar{gap:8px;}
@media(max-width:600px){body{padding:12px;font-size:13px}header{gap:9px;padding-bottom:12px}header .appicon{width:40px;height:40px;flex-basis:40px;border-radius:12px;font-size:21px}header h1{font-size:19px}header .spacer{flex:1 1 100%}.toolbar{align-items:stretch}.toolbar button,.toolbar input,.toolbar select{max-width:100%}.panel,.widget{padding:12px;border-radius:13px}.layout{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style><style id="org-app-finish">
:root{--accent:#4f7cff;--soft:#eaf0ff;--line:#dfe5ef;--shadow:0 12px 32px rgba(24,39,75,.08)}
body{padding:clamp(14px,2.1vw,28px);background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--soft) 72%,transparent),transparent 48%),var(--bg);font-size:14px;line-height:1.5}
header{position:relative;gap:14px;padding:0 0 18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
header .appicon{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--soft),var(--panel));border:1px solid var(--line);box-shadow:0 5px 16px rgba(45,65,110,.08)}
header h1{font-size:clamp(20px,2.2vw,25px);letter-spacing:-.035em;font-weight:750}

.toolbar{gap:8px;margin:14px 0 20px}
button,.filebtn{min-height:36px;border-radius:10px;box-shadow:0 1px 2px rgba(20,35,60,.035);transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease}
button:hover,.filebtn:hover{box-shadow:0 5px 14px rgba(38,66,120,.09);transform:translateY(-1px)}
button:active,.filebtn:active{transform:translateY(0) scale(.985)}
button.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,#283c99));box-shadow:0 5px 13px color-mix(in srgb,var(--accent) 24%,transparent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
input:not([type=checkbox]):not([type=range]):not([type=color]),select,textarea{max-width:100%;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):not([type=range]):not([type=color]):focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent);outline:0}
.panel,.widget,.card,.metric-card,.stat-card,.calendar-panel,.paint-panel,.photo-panel,.player-panel,.weather-panel{border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.panel,.widget{padding:clamp(13px,1.6vw,20px)}

::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 60%,transparent);background-clip:padding-box}

</head><body data-theme="light">
<header><div class="appicon">🖼️</div><div><h1>ORG Photos</h1><p>Browse local images in a thumbnail gallery and preview them.</p></div><div class="spacer"></div><label class="settings">Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
<main><div class="toolbar"><label class="filebtn">＋ Open photos<input id="files" type="file" accept="image/*" multiple hidden></label><button id="clear">Clear gallery</button><span id="count" class="muted">No images selected</span></div><div id="gallery" class="gallery"></div><dialog id="preview"><button id="close" class="close">×</button><img id="big"><div class="toolbar"><button id="rotate">Rotate</button><button id="download" class="primary">Download image</button></div></dialog><div class="widget"><b>🖼️ Gallery widget</b><p id="photoWidget">Choose photos to build your gallery.</p></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function setTheme(t){let v=t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;document.body.dataset.theme=v;document.documentElement.style.colorScheme=v;try{localStorage.setItem("orgos.appTheme",t)}catch(e){}}
let saved="system";try{saved=localStorage.getItem("orgos.appTheme")||"system"}catch(e){}theme.value=saved;setTheme(saved);theme.onchange=()=>setTheme(theme.value);matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(theme.value==="system")setTheme("system")});
let pics=[];function render(){gallery.innerHTML=pics.map((p,i)=>'<button class="thumb" data-p="'+i+'"><img src="'+p.url+'" alt="'+esc(p.name)+'"><span>'+esc(p.name)+'</span></button>').join("");count.textContent=pics.length+" images";photoWidget.textContent=pics.length?pics.length+" photos in this session":"Choose photos to build your gallery.";gallery.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>open(+b.dataset.p))}let current=0,angle=0;function open(i){current=i;angle=0;big.src=pics[i].url;big.style.transform="rotate(0deg)";preview.showModal()}files.onchange=()=>{pics.push(...[...files.files].map(f=>({name:f.name,url:URL.createObjectURL(f)})));render()};clear.onclick=()=>{pics.forEach(p=>URL.revokeObjectURL(p.url));pics=[];render()};close.onclick=()=>preview.close();rotate.onclick=()=>{angle=(angle+90)%360;big.style.transform="rotate("+angle+"deg)"};download.onclick=()=>{let a=document.createElement("a");a.href=pics[current].url;a.download=pics[current].name;a.click()};
</script></body></html>

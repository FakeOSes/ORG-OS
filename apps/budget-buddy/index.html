<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Buddy</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:15px system-ui,sans-serif;color:#e7edf8;background:#111827}h1{margin:0 0 8px;font-size:26px}p{color:#aebbd0;line-height:1.5}input,textarea,button{font:inherit;border:1px solid #36445a;border-radius:9px;padding:10px;background:#1b2638;color:#f8fafc;margin:4px 3px 8px 0}input,textarea{max-width:100%}button{cursor:pointer;background:#253d62}button:hover{background:#31527f}#list p,#board section,details{padding:12px;border:1px solid #344258;border-radius:10px;margin:8px 0}a{color:#93c5fd}#preview{padding:30px;border-radius:12px;margin:14px 0;font-size:22px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols textarea{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:10px}@media(max-width:600px){body{padding:16px}.cols{grid-template-columns:1fr}}</style><body><h1>💸 Budget Buddy</h1><p>Track a simple budget on this device.</p><input id="budget" type="number" placeholder="Monthly budget"><form id="add"><input id="label" placeholder="Expense name" required><input id="amount" type="number" min="0" step=".01" placeholder="Amount" required><button>Add expense</button></form><h2 id="total"></h2><div id="list"></div><script>let items=JSON.parse(localStorage.getItem('org-budget')||'[]');budget.value=localStorage.getItem('org-budget-limit')||'';function render(){localStorage.setItem('org-budget',JSON.stringify(items));localStorage.setItem('org-budget-limit',budget.value);let n=items.reduce((a,x)=>a+x.amount,0);total.textContent='Spent: $'+n.toFixed(2)+' · Remaining: $'+((+budget.value||0)-n).toFixed(2);list.innerHTML=items.map((x,i)=>'<p>'+x.label+' — $'+x.amount.toFixed(2)+' <button data-i="'+i+'">Remove</button></p>').join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.i,1);render()})}budget.onchange=render;add.onsubmit=e=>{e.preventDefault();items.push({label:label.value,amount:+amount.value});label.value='';amount.value='';render()};render()</script><style id="org-app-finish">
*{box-sizing:border-box}body{min-height:100vh;padding:clamp(14px,2vw,28px);background:radial-gradient(ellipse at 0 0,#1d2b46 0,transparent 48%),#111827;color:#e7edf8;font:15px/1.55 system-ui,-apple-system,sans-serif}
h1{font-size:clamp(22px,2.3vw,29px);letter-spacing:-.035em;margin:0 0 10px}p{line-height:1.55}
input,textarea,select,button{font:inherit;border-radius:10px;transition:border-color .15s,background .15s,box-shadow .15s,transform .15s}
input,textarea,select{max-width:100%;border:1px solid #3b4a63;padding:10px 12px;background:#182235;color:#f8fafc}
button{min-height:38px;border:1px solid #3b4a63;padding:9px 13px;background:linear-gradient(135deg,#253d62,#1b2b44);color:#f8fafc;cursor:pointer}
button:hover{border-color:#7da5ff;background:#2b4771;box-shadow:0 6px 18px #0003;transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.985)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4f7cff77;outline-offset:2px}
a{color:#a8c8ff}details,section,article{border-radius:12px}
@media(max-width:620px){body{padding:13px}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>World Clock · ORG OS</title><style>:root{color-scheme:dark;--bg:#0d1422;--panel:#151f30;--line:#2b394d;--text:#edf3ff;--muted:#9aa9be;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;padding:22px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 95% 0,rgba(96,165,250,.14),transparent 40%),var(--bg);color:var(--text)}h1,h2,p{margin-top:0}h1{font-size:24px;letter-spacing:-.04em;margin-bottom:5px}h2{font-size:16px;margin-bottom:12px}header{margin-bottom:22px}header p,.muted{color:var(--muted);font-size:12px}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:#1a2638;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#08111e;font-weight:700}button.danger{background:#7f1d1d;border-color:#991b1b}input:not([type=checkbox]):not([type=color]):not([type=range]),select,textarea{width:100%;background:#0a111d;border:1px solid var(--line);border-radius:9px;padding:10px;outline-color:var(--accent)}textarea{min-height:180px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.actions,.rowline{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.panel,.result-box,.clockface{padding:18px;border:1px solid var(--line);border-radius:15px;background:rgba(21,31,48,.86);margin:12px 0}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--accent);font-weight:800}.bigtime{font-size:clamp(36px,8vw,60px);font-weight:750;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.number{font-size:28px;font-variant-numeric:tabular-nums}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview{padding:14px;background:#101a29;border:1px solid var(--line);border-radius:10px;min-height:220px;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{margin:12px 0}.preview p{color:#d1dced}.preview code{background:#26364b;padding:2px 4px;border-radius:4px}.notice{padding:10px;border-radius:8px;background:#1e293b;margin:12px 0}.good{color:#86efac}.bad{color:#fca5a5}.colorbox{height:110px;border-radius:14px;background:#60a5fa;margin:10px 0 18px}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}.swatch{height:68px;padding:4px;font-size:10px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats>div{padding:12px;border-radius:10px;background:#101a29;text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;color:var(--muted)}.prompt{padding:14px;border-radius:10px;background:#101a29;line-height:1.8}.track{height:7px;background:#29374a;border-radius:9px;overflow:hidden;margin:18px 0}.track>div{height:100%;width:0;background:var(--accent);transition:width .2s}.modes{justify-content:flex-start}.keylist{display:grid;gap:6px;margin:12px 0}.keyrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:0}.keyrow input{width:auto}.keyrow span{overflow-wrap:anywhere;flex:1;color:var(--text)}.keyrow small{color:var(--muted)}.calc{max-width:420px;margin:auto}.display{padding:18px 12px;text-align:right;font-size:34px;overflow-wrap:anywhere;background:#070d16;border-radius:12px}.history{text-align:right;color:var(--muted);font-size:12px;height:22px;margin:6px 0}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{font-size:18px;padding:14px 5px}.keys .operator{background:#23334a}.keys .primary{background:var(--accent)}@media(max-width:480px){body{padding:14px}.split{grid-template-columns:1fr}.stats strong{font-size:18px}}</style><style id="org-app-finish">
:root{--accent:#4f7cff;--soft:#eaf0ff;--line:#dfe5ef;--shadow:0 12px 32px rgba(24,39,75,.08)}
body{padding:clamp(14px,2.1vw,28px);background:radial-gradient(ellipse at 0 0,rgba(79,124,255,.08),transparent 48%),var(--bg);font-size:14px;line-height:1.5}
header{gap:14px;padding:0 0 18px;margin-bottom:20px;border-bottom:1px solid var(--line)}

button:hover,.filebtn:hover{box-shadow:0 5px 14px rgba(38,66,120,.09);transform:translateY(-1px)}
button:active,.filebtn:active{transform:translateY(0) scale(.985)}
button.primary{background:linear-gradient(135deg,var(--accent),#354fba);box-shadow:0 5px 13px rgba(79,124,255,.2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(79,124,255,.35);outline-offset:2px}

input:not([type=checkbox]):not([type=range]):not([type=color]):focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.12);outline:0}
.panel,.widget,.card,.metric-card,.stat-card,.calendar-panel,.paint-panel,.photo-panel,.player-panel,.weather-panel{border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.panel,.widget{padding:clamp(13px,1.6vw,20px)}

hr{border:0;border-top:1px solid var(--line)}

@media(max-width:620px){body{padding:13px}header{gap:10px;padding-bottom:13px;margin-bottom:15px}header .appicon{width:42px;height:42px}header h1{font-size:19px}.toolbar{margin:10px 0 14px}.toolbar button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body><header><h1>⏱️ World Clock</h1><p>Live digital clock, stopwatch, and countdown timer.</p></header><main><div class="clockface"><div class="eyebrow">LOCAL TIME</div><div id="time" class="bigtime">--:--:--</div><div id="date" class="muted"></div></div><section class="panel"><h2>Stopwatch</h2><div id="sw" class="number">00:00.0</div><div class="actions"><button class="primary" id="swStart">Start</button><button id="swReset">Reset</button></div></section><section class="panel"><h2>Countdown</h2><div class="actions"><input id="mins" type="number" min="1" max="999" value="5" aria-label="Minutes"><button class="primary" id="timerStart">Start timer</button><button id="timerReset">Reset</button></div><div id="count" class="number">05:00</div></section></main><script>function tick(){const d=new Date();document.getElementById("time").textContent=d.toLocaleTimeString();document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}tick();setInterval(tick,1000);let swStart=0,swElapsed=0,swRun=false;function swTick(){if(swRun)document.getElementById("sw").textContent=((swElapsed+performance.now()-swStart)/1000).toFixed(1)+"s"}setInterval(swTick,100);document.getElementById("swStart").onclick=()=>{swRun=!swRun;if(swRun)swStart=performance.now();else swElapsed+=performance.now()-swStart;document.getElementById("swStart").textContent=swRun?"Pause":"Resume"};document.getElementById("swReset").onclick=()=>{swRun=false;swElapsed=0;document.getElementById("sw").textContent="00:00.0";document.getElementById("swStart").textContent="Start"};let remain=300,run=false,tid;function draw(){document.getElementById("count").textContent=String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0")}document.getElementById("timerStart").onclick=()=>{if(run){clearInterval(tid);run=false;document.getElementById("timerStart").textContent="Resume";return}if(remain<=0)remain=Math.max(1,Number(document.getElementById("mins").value)||5)*60;run=true;document.getElementById("timerStart").textContent="Pause";tid=setInterval(()=>{remain--;draw();if(remain<=0){clearInterval(tid);run=false;document.getElementById("timerStart").textContent="Start timer";alert("Countdown complete!")}},1000)};document.getElementById("timerReset").onclick=()=>{clearInterval(tid);run=false;remain=Math.max(1,Number(document.getElementById("mins").value)||5)*60;draw();document.getElementById("timerStart").textContent="Start timer"};</script></body></html>

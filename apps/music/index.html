<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ORG Music — ORG-OS</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--text:#202638;--muted:#687286;--line:#e0e5ef;--accent:#4778f5;--soft:#eaf0ff;--shadow:0 8px 28px #24385a0c}*{box-sizing:border-box}body[data-theme=dark]{color-scheme:dark;--bg:#111722;--panel:#1b2331;--text:#edf2fb;--muted:#aab6c9;--line:#343e50;--accent:#89a7ff;--soft:#293650;--shadow:0 8px 28px #0003}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,sans-serif;padding:22px}button,input,select{font:inherit}button,.filebtn{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--text)}button:hover,.filebtn:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}input:not([type=checkbox]):not([type=range]):not([type=color]),select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}input[type=color]{width:38px;height:32px;border:0;background:transparent}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}header .appicon{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px}header h1{font-size:22px;margin:0}header p{margin:2px 0;color:var(--muted)}header .spacer{flex:1}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.toolbar h2{margin:0 auto 0 0}.panel,.widget{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.widget{margin-top:16px;background:var(--soft);box-shadow:none}.widget p{margin:6px 0 0;color:var(--muted)}h2,h3{margin:0 0 12px}h3{font-size:15px}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:16px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays span{text-align:center;color:var(--muted);padding:8px 0}.day{min-height:56px;text-align:left;border-radius:9px}.day.today{background:var(--soft);border-color:var(--accent);font-weight:800}.day.empty{border:0}.event,.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.event b,.tasktext{flex:1;min-width:0}.event small,.tasktext small{display:block}.tasktext.done{text-decoration:line-through;color:var(--muted)}.task input{accent-color:var(--accent)}.filter.active,.track.selected{background:var(--soft);border-color:var(--accent)}.canvas-wrap{background:#dfe4ed;padding:10px;border-radius:14px;overflow:auto}.canvas-wrap canvas{display:block;max-width:100%;background:white;touch-action:none;border-radius:5px}.hero{display:flex;align-items:center;gap:18px;margin:24px 0}.album{width:110px;height:110px;border-radius:18px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,var(--soft),var(--line))}audio{width:100%}.track{display:block;width:100%;text-align:left;margin:4px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.thumb{padding:7px;text-align:left;min-width:0}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}.thumb span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);max-width:90vw;max-height:90vh}dialog img{max-width:80vw;max-height:65vh;object-fit:contain;display:block}dialog .close{float:right}.weathercard{display:flex;justify-content:space-between;align-items:center;padding:24px;border-radius:20px;background:linear-gradient(135deg,var(--soft),var(--panel));border:1px solid var(--line);margin-bottom:16px}.weathercard h1{font-size:52px;margin:4px 0}.weathericon{font-size:64px}.forecast,.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}.forecastday,.metric{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}.forecastday b{font-size:22px}.metric strong{font-size:18px;overflow-wrap:anywhere}.metric{margin-bottom:16px}.settings{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}@media(max-width:650px){body{padding:14px}.layout{grid-template-columns:1fr}header h1{font-size:19px}.day{min-height:42px;padding:5px}.weathercard{padding:16px}.weathericon{font-size:44px}}
</style></head><body data-theme="light">
<header><div class="appicon">🎵</div><div><h1>ORG Music</h1><p>Play audio files locally with a queue and playback controls.</p></div><div class="spacer"></div><label class="settings">Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
<main><div class="hero"><div class="album">♫</div><div><h2 id="track">Choose audio files</h2><p class="muted">Your music stays on your device.</p><label class="filebtn">＋ Add tracks<input id="files" type="file" accept="audio/*" multiple hidden></label></div></div><audio id="audio" controls></audio><div class="toolbar"><button id="prev">⏮ Previous</button><button id="next" class="primary">Next ⏭</button><label>Volume <input id="volume" type="range" min="0" max="1" step=".05" value=".8"></label></div><h3>Queue</h3><div id="queue"></div><div class="widget"><b>🎧 Now playing widget</b><p id="now">Nothing playing yet</p></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function setTheme(t){let v=t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;document.body.dataset.theme=v;document.documentElement.style.colorScheme=v;try{localStorage.setItem("orgos.appTheme",t)}catch(e){}}
let saved="system";try{saved=localStorage.getItem("orgos.appTheme")||"system"}catch(e){}theme.value=saved;setTheme(saved);theme.onchange=()=>setTheme(theme.value);matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(theme.value==="system")setTheme("system")});
let tracks=[],index=0;function play(i){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;audio.src=tracks[index].url;track.textContent=tracks[index].name;now.textContent="▶ "+tracks[index].name;audio.play().catch(()=>{});render()}function render(){queue.innerHTML=tracks.map((t,i)=>'<button class="track '+(i===index?'selected':'')+'" data-i="'+i+'">'+(i===index?'▶ ':'♫ ')+esc(t.name)+'</button>').join("");queue.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>play(+b.dataset.i))}files.onchange=()=>{tracks.push(...[...files.files].map(f=>({name:f.name,url:URL.createObjectURL(f)})));if(tracks.length)play(Math.max(0,tracks.length-1))};prev.onclick=()=>play(index-1);next.onclick=()=>play(index+1);audio.onended=()=>play(index+1);volume.oninput=()=>audio.volume=+volume.value;audio.volume=.8;
</script></body></html>

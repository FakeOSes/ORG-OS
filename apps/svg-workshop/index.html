<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Workshop · ORG OS</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#141e30;--line:#29374d;--muted:#9caec4;--text:#f2f6fc;--accent:#fb7185}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.glyph{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 18%,var(--panel));font-size:28px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}h1{font-size:24px;letter-spacing:-.7px;margin:0}header p{margin:3px 0 0;color:var(--muted)}section,.panel{background:#141e30dd;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;min-width:0}h2{font-size:14px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input,textarea,select{width:100%;min-width:0;background:#0b1322;color:var(--text);border:1px solid #34445c;border-radius:9px;padding:10px 11px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical}button{background:var(--accent);color:#08111f;border:0;border-radius:9px;padding:10px 14px;font:600 13px inherit;cursor:pointer}button.secondary{background:#26364e;color:var(--text);border:1px solid #3a4a61}button.danger{background:#512d3a;color:#ffdbe2}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.status{color:var(--muted);font-size:12px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#24364d;color:#c6d7ec;font-size:11px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#09111e;border:1px solid var(--line);border-radius:10px;padding:13px;min-height:50px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:#a9bed7} @media(max-width:600px){body{padding:14px}header{align-items:flex-start}h1{font-size:20px}}
</style></head><body><main><header><div class="glyph">◇</div><div><h1>SVG Workshop</h1><p>Build simple vector artwork with editable shapes and export a real SVG file.</p></div></header>
<section class="grid"><div><label for="shape">Shape</label><select id="shape"><option value="circle">Circle</option><option value="rect">Rounded rectangle</option><option value="star">Star</option><option value="text">Text</option></select></div><div><label for="color">Fill color</label><input id="color" type="color" value="#60a5fa" style="height:42px;padding:4px"></div><div><label for="size">Size: <span id="size-label">100</span></label><input id="size" type="range" min="20" max="220" value="100"></div></section><section class="grid"><div><label for="caption">Text (for text shape)</label><input id="caption" value="ORG"></div><div><label for="background">Canvas background</label><input id="background" type="color" value="#ffffff" style="height:42px;padding:4px"></div></section><section><div class="row"><h2>Canvas preview</h2><button id="export">Export SVG</button></div><div style="border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" style="display:block;width:100%;max-height:420px"><rect id="bg" width="600" height="360" fill="#fff"/><circle id="art" cx="300" cy="180" r="100" fill="#60a5fa"/></svg></div><p class="status">Use this to create a simple logo mark, badge, or vector graphic.</p></section></main></body></html>

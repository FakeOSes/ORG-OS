<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SVG Workshop · ORG OS</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7ff;
      --panel: #ffffff;
      --panel-alt: #edf3ff;
      --line: #dfe5ef;
      --muted: #5d6b85;
      --text: #1a2a3d;
      --accent: #4f7cff;
      --accent-2: #354fba;
      --soft: #eaf0ff;
      --shadow: 0 12px 32px rgba(24, 39, 75, 0.08);
      --canvas-start: #ffffff;
      --canvas-end: #f4f7ff;
      --input-bg: #ffffff;
      --secondary-bg: #ffffff;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111c2d;
      --panel-alt: #17253d;
      --line: #2a3d5d;
      --muted: #9caec7;
      --text: #edf3ff;
      --accent: #7aa2ff;
      --accent-2: #4f7cff;
      --soft: #dfe9ff;
      --shadow: 0 18px 45px rgba(2, 6, 23, 0.35);
      --canvas-start: #121c2d;
      --canvas-end: #0b1220;
      --input-bg: #131d2c;
      --secondary-bg: rgba(255,255,255,0.03);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--accent) 10%, transparent), transparent 30%),
        var(--bg);
      color: var(--text);
      transition: background-color .18s ease, color .18s ease;
    }

    body { padding: clamp(14px, 2vw, 28px); }
    main { max-width: 980px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 0 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .glyph {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--soft), var(--panel));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      color: var(--accent);
      font-size: 24px;
      font-weight: 800;
    }

    .heading { flex: 1; }
    h1 { margin: 0 0 4px; font-size: clamp(22px, 2.2vw, 28px); letter-spacing: -0.04em; }
    p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      align-items: end;
      margin-bottom: 18px;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input, select, button { font: inherit; }

    input[type="text"], select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 10px;
      background: var(--input-bg);
      color: var(--text);
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    input[type="color"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--input-bg);
      padding: 4px;
      cursor: pointer;
    }

    .check-row {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .check-row input { width: 17px; height: 17px; accent-color: var(--accent); }

    .canvas-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--canvas-start), var(--canvas-end));
      box-shadow: var(--shadow);
      min-height: 420px;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    svg { width: min(100%, 700px); height: auto; display: block; border-radius: 16px; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .size-badge {
      min-width: 72px;
      text-align: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-2);
      font-weight: 700;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--soft);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
      box-shadow: 0 1px 2px rgba(20,35,60,.08);
    }

    button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
    button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
    button.secondary { background: var(--secondary-bg); border-color: var(--line); color: var(--text); }
    #themeToggle { padding: 9px 13px; white-space: nowrap; }

    @media (max-width: 600px) {
      body { padding: 14px; }
      header { align-items: flex-start; flex-wrap: wrap; }
      #themeToggle { margin-left: 66px; }
      .canvas-panel { min-height: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="glyph" aria-hidden="true">◇</div>
      <div class="heading">
        <h1>SVG Workshop</h1>
        <p>Build simple vector artwork with editable shapes, colors, and export-ready SVG output.</p>
      </div>
      <button id="themeToggle" class="secondary" type="button" aria-pressed="false">Use dark mode</button>
    </header>

    <section class="toolbar" aria-label="Shape controls">
      <div class="control">
        <label for="shape">Shape</label>
        <select id="shape">
          <option value="circle">Circle</option>
          <option value="rect">Rounded rectangle</option>
          <option value="star">Star</option>
          <option value="triangle">Triangle</option>
          <option value="diamond">Diamond</option>
        </select>
      </div>

      <div class="control">
        <label for="size">Size</label>
        <input id="size" type="range" min="40" max="220" value="120">
      </div>

      <div class="control">
        <label for="color">Fill</label>
        <input id="color" type="color" value="#4f7cff">
      </div>

      <div class="control">
        <label for="background">Artwork background</label>
        <input id="background" type="color" value="#eef3ff">
      </div>

      <div class="control">
        <label for="stroke">Stroke</label>
        <input id="stroke" type="color" value="#233b6d">
      </div>

      <div class="control">
        <label for="strokeWidth">Stroke width</label>
        <input id="strokeWidth" type="range" min="0" max="18" value="4">
      </div>

      <div class="control">
        <label for="caption">Caption (optional)</label>
        <input id="caption" type="text" value="ORG" maxlength="12" placeholder="Leave blank for no text">
        <label class="check-row" for="showCaption"><input id="showCaption" type="checkbox" checked> Show caption</label>
      </div>
    </section>

    <div class="canvas-panel">
      <svg id="canvas" viewBox="-200 -180 400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SVG artwork preview">
        <rect x="-200" y="-180" width="400" height="360" rx="28" id="bg" fill="#eef3ff"></rect>
        <g id="art"></g>
        <text id="captionText" x="0" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" font-size="36" letter-spacing="1.5">ORG</text>
      </svg>
    </div>

    <div class="meta">
      <div class="size-badge">Size: <span id="size-label">120</span></div>
      <div class="actions">
        <button id="randomize" class="secondary" type="button">Randomize</button>
        <button id="export" class="primary" type="button">Export SVG</button>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function setTheme(theme) {
      const dark = theme === 'dark';
      document.body.dataset.theme = dark ? 'dark' : 'light';
      $('themeToggle').textContent = dark ? 'Use light mode' : 'Use dark mode';
      $('themeToggle').setAttribute('aria-pressed', String(dark));
      try { localStorage.setItem('svg-workshop-theme', dark ? 'dark' : 'light'); } catch (_) { /* Storage may be disabled. */ }
    }

    try {
      if (localStorage.getItem('svg-workshop-theme') === 'dark') setTheme('dark');
    } catch (_) { /* Keep light mode when storage is unavailable. */ }

    $('themeToggle').addEventListener('click', () => {
      setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    function starPoints(cx, cy, outer, inner, points = 5) {
      const result = [];
      for (let i = 0; i < points * 2; i++) {
        const angle = (Math.PI / points) * i - Math.PI / 2;
        const radius = i % 2 === 0 ? outer : inner;
        result.push(`${(cx + Math.cos(angle) * radius).toFixed(2)},${(cy + Math.sin(angle) * radius).toFixed(2)}`);
      }
      return result.join(' ');
    }

    function trianglePoints(cx, cy, size) {
      const h = size * 0.9;
      return `${cx},${cy - h / 2} ${cx - size / 2},${cy + h / 2} ${cx + size / 2},${cy + h / 2}`;
    }

    function diamondPoints(cx, cy, size) {
      return `${cx},${cy - size / 2} ${cx + size / 2},${cy} ${cx},${cy + size / 2} ${cx - size / 2},${cy}`;
    }

    function contrastColor(hex) {
      const value = hex.slice(1);
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.66 ? '#1a2a3d' : '#f7fbff';
    }

    function draw() {
      const shape = $('shape').value;
      const size = Number($('size').value);
      const color = $('color').value;
      const bg = $('background').value;
      const stroke = $('stroke').value;
      const strokeWidth = Number($('strokeWidth').value);
      const caption = $('caption').value.trim();
      const art = $('art');
      const captionText = $('captionText');

      $('size-label').textContent = size;
      $('bg').setAttribute('fill', bg);
      captionText.textContent = caption.toUpperCase();
      captionText.setAttribute('fill', contrastColor(bg));
      captionText.setAttribute('font-size', String(Math.max(22, size * 0.26)));
      captionText.style.display = $('showCaption').checked && caption ? '' : 'none';

      const radius = size / 2;
      let markup = '';
      switch (shape) {
        case 'circle':
          markup = `<circle cx="0" cy="0" r="${radius}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" />`;
          break;
        case 'rect':
          markup = `<rect x="${-radius}" y="${-radius}" width="${size}" height="${size}" rx="${size * 0.22}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" />`;
          break;
        case 'star':
          markup = `<polygon points="${starPoints(0, 0, radius, radius * 0.46)}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" />`;
          break;
        case 'triangle':
          markup = `<polygon points="${trianglePoints(0, 0, size)}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" />`;
          break;
        case 'diamond':
          markup = `<polygon points="${diamondPoints(0, 0, size)}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" />`;
          break;
      }
      art.innerHTML = markup;
    }

    const controls = ['shape', 'size', 'color', 'background', 'stroke', 'strokeWidth', 'caption', 'showCaption'];
    controls.forEach((id) => {
      $(id).addEventListener('input', draw);
      $(id).addEventListener('change', draw);
    });

    $('randomize').addEventListener('click', () => {
      const shapes = ['circle', 'rect', 'star', 'triangle', 'diamond'];
      const palette = ['#7aa2ff', '#fb7185', '#22c55e', '#f59e0b', '#8b5cf6', '#06b6d4'];
      $('shape').value = shapes[Math.floor(Math.random() * shapes.length)];
      $('size').value = String(Math.floor(80 + Math.random() * 100));
      $('color').value = palette[Math.floor(Math.random() * palette.length)];
      $('background').value = ['#eef3ff', '#fff3e8', '#eefaf2', '#f8f2ff', '#fff0f2'][Math.floor(Math.random() * 5)];
      $('stroke').value = ['#233b6d', '#3d2f76', '#214c3b', '#7a3e09', '#5e1d38'][Math.floor(Math.random() * 5)];
      $('strokeWidth').value = String(Math.floor(Math.random() * 8) + 2);
      $('caption').value = ['ORG', 'A', 'NOVA', 'SVG', 'BLOOM', 'PIX'][Math.floor(Math.random() * 6)];
      $('showCaption').checked = true;
      draw();
    });

    $('export').addEventListener('click', () => {
      const svg = $('canvas').cloneNode(true);
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const source = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `org-svg-${$('shape').value}.svg`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    });

    draw();
  </script>
</body>
</html>

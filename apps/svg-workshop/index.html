<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SVG Workshop · ORG OS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111c2d;
      --panel-alt: #17253d;
      --line: #2a3d5d;
      --muted: #9caec7;
      --text: #edf3ff;
      --accent: #7aa2ff;
      --accent-2: #4f7cff;
      --soft: #dfe9ff;
      --shadow: 0 18px 45px rgba(2, 6, 23, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(122, 162, 255, 0.16), transparent 30%),
        radial-gradient(circle at bottom right, rgba(79, 124, 255, 0.12), transparent 25%),
        var(--bg);
      color: var(--text);
    }

    body {
      padding: clamp(14px, 2vw, 28px);
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 0 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .glyph {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(122,162,255,0.2), rgba(18,28,45,1));
      border: 1px solid rgba(122, 162, 255, 0.35);
      box-shadow: 0 10px 22px rgba(79,124,255,0.18);
      color: var(--soft);
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(22px, 2.2vw, 28px);
      letter-spacing: -0.04em;
      color: var(--text);
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      align-items: end;
      margin-bottom: 18px;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 12px;
      background: rgba(17, 28, 45, 0.82);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input, select, button {
      font: inherit;
    }

    input[type="text"],
    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 10px;
      background: rgba(19, 29, 44, 0.95);
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="color"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(19, 29, 44, 0.95);
      padding: 4px;
      cursor: pointer;
    }

    .canvas-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(18, 28, 45, 0.96), rgba(11, 18, 32, 0.96));
      box-shadow: var(--shadow);
      min-height: 420px;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    svg {
      width: min(100%, 700px);
      height: auto;
      display: block;
      border-radius: 16px;
      background: transparent;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .size-badge {
      min-width: 72px;
      text-align: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(122,162,255,0.12);
      border: 1px solid rgba(122,162,255,0.28);
      color: var(--soft);
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 0;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 16px;
      background: rgba(122, 162, 255, 0.12);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
      box-shadow: 0 1px 2px rgba(2, 6, 23, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(28, 45, 80, 0.35);
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border-color: rgba(122, 162, 255, 0.38);
    }

    button.secondary {
      background: rgba(255,255,255,0.03);
      border-color: var(--line);
      color: var(--text);
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .canvas-panel { min-height: 300px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="glyph">◇</div>
      <div>
        <h1>SVG Workshop</h1>
        <p>Build simple vector artwork with editable shapes, colors, and export-ready SVG output.</p>
      </div>
    </header>

    <section class="toolbar" aria-label="Shape controls">
      <div class="control">
        <label for="shape">Shape</label>
        <select id="shape">
          <option value="circle">Circle</option>
          <option value="rect">Rounded rectangle</option>
          <option value="star">Star</option>
          <option value="triangle">Triangle</option>
          <option value="diamond">Diamond</option>
        </select>
      </div>

      <div class="control">
        <label for="size">Size</label>
        <input id="size" type="range" min="40" max="220" value="120">
      </div>

      <div class="control">
        <label for="color">Fill</label>
        <input id="color" type="color" value="#7aa2ff">
      </div>

      <div class="control">
        <label for="background">Background</label>
        <input id="background" type="color" value="#17253d">
      </div>

      <div class="control">
        <label for="stroke">Stroke</label>
        <input id="stroke" type="color" value="#dfe9ff">
      </div>

      <div class="control">
        <label for="strokeWidth">Stroke width</label>
        <input id="strokeWidth" type="range" min="0" max="18" value="4">
      </div>

      <div class="control">
        <label for="caption">Caption</label>
        <input id="caption" type="text" value="ORG" maxlength="12">
      </div>
    </section>

    <div class="canvas-panel">
      <svg id="canvas" viewBox="-200 -180 400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SVG artwork preview">
        <rect x="-200" y="-180" width="400" height="360" rx="28" id="bg" fill="#17253d"></rect>
        <g id="art"></g>
        <text id="captionText" x="0" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" font-size="36" letter-spacing="1.5">ORG</text>
      </svg>
    </div>

    <div class="meta">
      <div class="size-badge">Size: <span id="size-label">120</span></div>
      <div class="actions">
        <button id="randomize" class="secondary" type="button">Randomize</button>
        <button id="export" class="primary" type="button">Export SVG</button>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function starPoints(cx, cy, outer, inner, points = 5) {
      const result = [];
      for (let i = 0; i < points * 2; i++) {
        const angle = (Math.PI / points) * i - Math.PI / 2;
        const radius = i % 2 === 0 ? outer : inner;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        result.push(`${x.toFixed(2)},${y.toFixed(2)}`);
      }
      return result.join(' ');
    }

    function trianglePoints(cx, cy, size) {
      const h = size * 0.9;
      return `${cx},${cy - h / 2} ${cx - size / 2},${cy + h / 2} ${cx + size / 2},${cy + h / 2}`;
    }

    function diamondPoints(cx, cy, size) {
      return `${cx},${cy - size / 2} ${cx + size / 2},${cy} ${cx},${cy + size / 2} ${cx - size / 2},${cy}`;
    }

    function contrastColor(hex) {
      const value = hex.replace('#', '');
      const r = parseInt(value.substr(0, 2), 16);
      const g = parseInt(value.substr(2, 2), 16);
      const b = parseInt(value.substr(4, 2), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.66 ? '#0b1220' : '#f7fbff';
    }

    function draw() {
      const shape = $('shape').value;
      const size = Number($('size').value);
      const color = $('color').value;
      const bg = $('background').value;
      const stroke = $('stroke').value;
      const strokeWidth = Number($('strokeWidth').value);
      const caption = ($('caption').value || 'ORG').trim() || 'ORG';
      const art = $('art');

      $('size-label').textContent = size;
      $('bg').setAttribute('fill', bg);
      $('captionText').textContent = caption.toUpperCase();
      $('captionText').setAttribute('fill', contrastColor(bg));
      $('captionText').setAttribute('font-size', `${Math.max(22, size * 0.26)}`);

      let markup = '';
      const cx = 0;
      const cy = 0;
      const radius = size / 2;

      switch (shape) {
        case 'circle':
          markup = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" />`;
          break;
        case 'rect':
          markup = `<rect x="${-radius}" y="${-radius}" width="${size}" height="${size}" rx="${size * 0.22}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" />`;
          break;
        case 'star':
          markup = `<polygon points="${starPoints(cx, cy, radius, radius * 0.46, 5)}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" />`;
          break;
        case 'triangle':
          markup = `<polygon points="${trianglePoints(cx, cy, size)}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" />`;
          break;
        case 'diamond':
          markup = `<polygon points="${diamondPoints(cx, cy, size)}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" />`;
          break;
      }

      art.innerHTML = markup;
    }

    const controls = ['shape', 'size', 'color', 'background', 'stroke', 'strokeWidth', 'caption'];
    controls.forEach((id) => $(id).addEventListener('input', draw));
    controls.forEach((id) => $(id).addEventListener('change', draw));

    $('randomize').addEventListener('click', () => {
      const shapes = ['circle', 'rect', 'star', 'triangle', 'diamond'];
      const palette = ['#7aa2ff', '#fb7185', '#22c55e', '#f59e0b', '#8b5cf6', '#06b6d4'];
      $('shape').value = shapes[Math.floor(Math.random() * shapes.length)];
      $('size').value = String(Math.floor(80 + Math.random() * 100));
      $('color').value = palette[Math.floor(Math.random() * palette.length)];
      $('background').value = ['#17253d', '#1d2e44', '#293938', '#372a46', '#3d1f2a'][Math.floor(Math.random() * 5)];
      $('stroke').value = ['#dfe9ff', '#f9d6a5', '#c5ffda', '#f7c2d2', '#d8d0ff'][Math.floor(Math.random() * 5)];
      $('strokeWidth').value = String(Math.floor(Math.random() * 8) + 2);
      $('caption').value = ['ORG', 'A', 'NOVA', 'SVG', 'BLOOM', 'PIX'][Math.floor(Math.random() * 6)];
      draw();
    });

    $('export').addEventListener('click', () => {
      const svg = $('canvas').cloneNode(true);
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svg);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `org-svg-${$('shape').value}.svg`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });

    draw();
  </script>
</body>
</html>

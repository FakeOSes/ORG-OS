<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORG OS: GET READY</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
}

/* Cinematic background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at center,
        #292929 0%,
        #101010 38%,
        #000 78%);
    animation: atmosphere 8s ease-in-out infinite alternate;
    z-index: -2;
}

/* Film grain */
body::after {
    content: "";
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    opacity: .09;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    animation: grain .2s steps(2) infinite;
    z-index: 5;
}

.container {
    width: 90%;
    max-width: 850px;
    position: relative;
    z-index: 2;
    animation: reveal 2s ease forwards;
}

.label {
    font-size: 11px;
    letter-spacing: 8px;
    color: #aaa;
    margin-bottom: 35px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(38px, 8vw, 88px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: .98;
    text-transform: uppercase;
    text-shadow: 0 0 35px #ffffff30;
}

h1 span {
    display: block;
    margin-top: 14px;
    color: #fff;
    letter-spacing: 5px;
}

.line {
    width: 0;
    height: 1px;
    background: #fff;
    margin: 35px auto;
    animation: lineReveal 2s ease 1s forwards;
}

.description {
    color: #aaa;
    font-size: 14px;
    letter-spacing: 3px;
    line-height: 2;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 2s ease 1.5s forwards;
}

.signature {
    margin-top: 55px;
    font-size: 11px;
    letter-spacing: 5px;
    color: #777;
    opacity: 0;
    animation: fadeIn 2s ease 2s forwards;
}

.button {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 28px;
    border: 1px solid #777;
    color: white;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: .3s ease;
    opacity: 0;
    animation: fadeIn 2s ease 2.5s forwards;
}

.button:hover {
    background: white;
    color: black;
    border-color: white;
    box-shadow: 0 0 25px #ffffff35;
}

footer {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    font-size: 9px;
    letter-spacing: 4px;
    color: #555;
    z-index: 2;
}
audio {
    display: block;
    width: 260px;
    max-width: 100%;
    margin: 25px auto 0;
    opacity: 0;
    animation: fadeIn 2s ease 2.2s forwards;
    filter: grayscale(1);
}
    
@keyframes reveal {
    from { opacity: 0; transform: scale(1.04); filter: blur(8px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes lineReveal {
    to { width: 130px; }
}

@keyframes atmosphere {
    from { opacity: .55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.12); }
}

@keyframes grain {
    0% { transform: translate(0, 0); }
    25% { transform: translate(2%, -1%); }
    50% { transform: translate(-1%, 2%); }
    75% { transform: translate(1%, 1%); }
    100% { transform: translate(-2%, -1%); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        opacity: 1 !important;
    }
}
</style>
</head>

<body>

<main class="container">
    <div class="label">ORG OS PRESENTS</div>

    <h1>
        GET READY FOR<br>
        A HUGE UPDATE.
        <span>THUNDER.</span>
    </h1>

    <div class="line"></div>

    <p class="description">
        A new era is approaching.<br>
        Prepare for something extraordinary.
    </p>

    <div class="signature">
        — THE ORG OS TEAM
    </div>
<audio id="announcementMusic" controls autoplay loop>
    <source src="AC%20DC%20-%20Thunderstruck%20(Official%20Video).mp3" type="audio/mpeg">
    Your browser does not support audio.
</audio> 
    <a class="button"
       href="https://org-os-website.vercel.app"
       target="_blank"
       rel="noopener noreferrer">
       OFFICIAL WEBSITE
    </a>
</main>

<footer>
    ORG OS 2026 · PEAK OS
</footer>

</body>
</html>

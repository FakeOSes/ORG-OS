<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Sunset</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased flex items-center justify-center p-6 selection:bg-white selection:text-black">

    <!-- Centered Announcement Container -->
    <main class="max-w-2xl text-center space-y-8 animate-fade-in">
        
        <!-- Main Sunset Message -->
        <h1 class="text-2xl sm:text-4xl md:text-5xl font-light tracking-tight leading-relaxed sm:leading-relaxed text-neutral-100">
            GET READY FOR A HUGE UPDATE. GET READY.
        </h1>

        <!-- Org OS Team Signature -->
        <p class="font-mono text-sm sm:text-base text-neutral-400 font-normal tracking-wide">
            — Org OS Team
        </p>

        <!-- Autoplay is attempted on page load; controls allow playback if the browser blocks it. -->
        <audio controls autoplay>
            <source src="AC%20DC%20-%20Thunderstruck%20(Official%20Video).mp3" type="audio/mpeg">
            Your browser does not support audio playback.
        </audio>
    </main>

</body>
</html>
